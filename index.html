function renderReturns(){$('view').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px"><h3 style="margin:0">Product Returns</h3><div style="display:flex;gap:4px"><button class="btn" onclick="exportReturns()">⬇ Export</button><button class="btn btn-primary" onclick="openReturnForm(null)">+ New Return</button></div></div><div class="alert alert-info"><b>How returns work:</b> Returns are linked to original sales. Net Sales = Gross Sales − Returns. Return service fees are deducted from profit. Original sale records are preserved for audit.</div><div class="kpi-grid" id="returnKpis"></div><div class="grid grid-2" style="margin-top:10px"><div><label>Marketplace Filter</label><select class="input" id="ret_mkt" onchange="drawReturns()"><option value="">All</option>${State.mkt.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div><label>Status Filter</label><select class="input" id="ret_status" onchange="drawReturns()"><option value="">All</option>${(State.settings.returnStatuses||[]).map(s=>`<option>${s}</option>`).join('')}</select></div></div></div><div class="card"><h3>Return History</h3><div class="table-wrap"><table class="data" id="ret_table"></table></div></div><div class="card"><h3>Returns by Marketplace</h3><div class="table-wrap"><table class="data" id="ret_mkt_table"></table></div></div>`;drawReturns();}
function drawReturns(){const mktFilter=$('ret_mkt')?.value||'';const statusFilter=$('ret_status')?.value||'';let returns=State.returns.slice();if(mktFilter)returns=returns.filter(r=>String(r.marketplaceId)===String(mktFilter));if(statusFilter)returns=returns.filter(r=>r.status===statusFilter);const totalReturns=returns.reduce((a,r)=>a+num(r.totalReturnedAmount),0);const totalServiceFees=returns.reduce((a,r)=>a+num(r.serviceFee),0);const totalOther=returns.reduce((a,r)=>a+num(r.otherCharges),0);const pendingReturns=returns.filter(r=>r.status==='Pending').length;const confirmedReturns=returns.filter(r=>r.status==='Confirmed'||r.status==='Processed').length;$('returnKpis').innerHTML=`<div class="kpi"><div class="kpi-label">Total Returns</div><div class="kpi-value danger">${fmt(totalReturns)}</div></div><div class="kpi"><div class="kpi-label">Service Charges</div><div class="kpi-value warn">${fmt(totalServiceFees)}</div></div><div class="kpi"><div class="kpi-label">Other Charges</div><div class="kpi-value warn">${fmt(totalOther)}</div></div><div class="kpi"><div class="kpi-label">Return Count</div><div class="kpi-value">${returns.length}</div></div><div class="kpi"><div class="kpi-label">Pending</div><div class="kpi-value warn">${pendingReturns}</div></div><div class="kpi"><div class="kpi-label">Confirmed</div><div class="kpi-value success">${confirmedReturns}</div></div>`;$('ret_table').innerHTML=`<thead><tr><th>Return ID</th><th>Date</th><th>Marketplace</th><th>Product</th><th>Qty</th><th>Amount</th><th>Service Fee</th><th>Status</th><th>Actions</th></tr></thead><tbody>${returns.length?returns.slice().sort((a,b)=>(b.returnDate||'').localeCompare(a.returnDate||'')).map(r=>{const m=State.mkt.find(x=>x.id==r.marketplaceId);return `<tr><td>#${r.id}</td><td class="nowrap">${esc(fmtDate(r.returnDate))}</td><td>${mktBadge(m)}</td><td>${esc(r.productName||'')}</td><td>${r.qtyReturned||0}</td><td class="danger">${fmt(r.totalReturnedAmount)}</td><td class="warn">${fmt(r.serviceFee)}</td><td>${statusPill(r.status)}</td><td><div class="row-actions"><button class="btn btn-sm" onclick="viewReturn(${r.id})">View</button><button class="btn btn-sm" onclick="openReturnForm(${r.id})">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteReturn(${r.id})">✕</button></div></td></tr>`;}).join(''):'<tr><td colspan="9" class="muted" style="text-align:center;padding:16px">No returns yet.</td></tr>'}</tbody>`;const byMkt=State.mkt.map(m=>{const mReturns=returns.filter(r=>String(r.marketplaceId)===String(m.id));const amount=mReturns.reduce((a,r)=>a+num(r.totalReturnedAmount),0);const fees=mReturns.reduce((a,r)=>a+num(r.serviceFee)+num(r.otherCharges),0);return{name:m.name,count:mReturns.length,amount,fees};});$('ret_mkt_table').innerHTML=`<thead><tr><th>Marketplace</th><th>Return Count</th><th>Total Returned</th><th>Total Charges</th></tr></thead><tbody>${byMkt.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td class="danger">${fmt(x.amount)}</td><td class="warn">${fmt(x.fees)}</td></tr>`).join('')}</tbody>`;}
function openReturnForm(id){const r=id?State.returns.find(x=>x.id===id):{returnDate:today(),marketplaceId:'',originalSaleId:'',originalSaleDate:'',orderId:'',productName:'',sku:'',qtyReturned:1,originalSellingPrice:0,totalReturnedAmount:0,serviceFee:0,otherCharges:0,reason:'',status:'Pending',notes:''};if(id&&!r){toast('Return not found','error');return;}const mopts=State.mkt.map(m=>`<option value="${m.id}" ${String(m.id)===String(r.marketplaceId)?'selected':''}>${esc(m.name)}</option>`).join('');const statuses=State.settings.returnStatuses||['Pending','Confirmed','Processed','Rejected'];openModal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">${id?'Edit':'New'} Product Return</h3><button class="btn" onclick="closeModal()">Close</button></div><div id="retErr" style="min-height:0;font-size:12px;margin-bottom:8px"></div><div class="alert alert-info" style="font-size:12px"><b>Method 1:</b> Select marketplace, then search for the original sale to auto-fill details.<br><b>Method 2:</b> Enter details manually for unlinked returns.</div><form id="retForm"><div class="grid grid-3"><div><label>Return Date *</label><input type="date" class="input" id="ret_date" value="${esc(r.returnDate||today())}" required></div><div><label>Marketplace *</label><select class="input" id="ret_mkt" required><option value="">Select...</option>${mopts}</select></div><div><label>Return Status *</label><select class="input" id="ret_status">${statuses.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div style="grid-column:span 3"><label>Link to Original Sale (optional)</label><div style="display:flex;gap:6px"><input class="input" id="ret_searchSale" placeholder="Search by Order ID, SKU, or Product..." style="flex:1"><button type="button" class="btn btn-sm" onclick="searchOriginalSale()">Search</button></div><div id="ret_searchResults" style="margin-top:6px"></div></div><div><label>Original Sale Date</label><input type="date" class="input" id="ret_origDate" value="${esc(r.originalSaleDate||'')}"></div><div><label>Original Order ID</label><input class="input" id="ret_orderId" value="${esc(r.orderId||'')}"></div><div><label>Original Sale ID (internal)</label><input class="input" id="ret_origSaleId" value="${r.originalSaleId||''}" readonly style="opacity:.6"></div><div style="grid-column:span 2"><label>Product Name *</label><input class="input" id="ret_product" value="${esc(r.productName||'')}" required></div><div><label>SKU / Store Code</label><input class="input" id="ret_sku" value="${esc(r.sku||'')}"></div><div><label>Quantity Returned *</label><input type="number" class="input" id="ret_qty" value="${r.qtyReturned||1}" min="1" step="1" required></div><div><label>Original Selling Price</label><input type="number" step="0.01" class="input" id="ret_price" value="${r.originalSellingPrice||0}"></div><div><label>Total Returned Amount *</label><input type="number" step="0.01" class="input" id="ret_amount" value="${r.totalReturnedAmount||0}" required></div><div><label>Return Service Fee</label><input type="number" step="0.01" class="input" id="ret_serviceFee" value="${r.serviceFee||0}"></div><div><label>Other Charges</label><input type="number" step="0.01" class="input" id="ret_otherCharges" value="${r.otherCharges||0}"></div><div><label>Return Reason</label><input class="input" id="ret_reason" value="${esc(r.reason||'')}"></div><div style="grid-column:span 3"><label>Notes</label><textarea class="input" id="ret_notes">${esc(r.notes||'')}</textarea></div></div><div style="margin-top:12px;padding:10px;background:var(--panel2);border:1px dashed var(--border);border-radius:7px;font-family:monospace;font-size:11px" id="retCalcPreview"></div><div style="margin-top:12px;display:flex;gap:4px;justify-content:flex-end"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit" id="ret_saveBtn">💾 Save Return</button></div></form>`);$('ret_qty').addEventListener('input',updateReturnCalc);$('ret_price').addEventListener('input',updateReturnCalc);updateReturnCalc();$('retForm').onsubmit=async e=>{e.preventDefault();if(State.saving)return;State.saving=true;const errEl=$('retErr');errEl.innerHTML='';const saveBtn=$('ret_saveBtn');btnLoading(saveBtn,true);const marketplaceId=+$('ret_mkt').value;const returnDate=$('ret_date').value;const status=$('ret_status').value;const qtyReturned=+$('ret_qty').value;const totalReturnedAmount=+$('ret_amount').value;const serviceFee=+$('ret_serviceFee').value;const otherCharges=+$('ret_otherCharges').value;const originalSaleId=$('ret_origSaleId').value?+$('ret_origSaleId').value:null;const errors=[];if(!marketplaceId)errors.push('Marketplace required');if(!returnDate)errors.push('Return date required');if(!status)errors.push('Status required');if(qtyReturned<1)errors.push('Quantity must be at least 1');if(totalReturnedAmount<0)errors.push('Amount cannot be negative');if(serviceFee<0)errors.push('Service fee cannot be negative');if(originalSaleId){const origSale=State.sales.find(s=>s.id===originalSaleId);if(origSale){const alreadyReturned=State.returns.filter(ret=>ret.originalSaleId===originalSaleId&&ret.id!==id).reduce((sum,ret)=>sum+num(ret.qtyReturned),0);const remaining=num(origSale.qty)-alreadyReturned;if(qtyReturned>remaining){errors.push(`Cannot return ${qtyReturned}. Only ${remaining} unit(s) remaining from original sale of ${origSale.qty}.`);}}}if(errors.length){errEl.innerHTML='<div class="alert alert-error">'+errors.map(e=>'• '+e).join('<br>')+'</div>';btnLoading(saveBtn,false);State.saving=false;return;}const rec={id:id||undefined,returnDate,marketplaceId,originalSaleId,originalSaleDate:$('ret_origDate').value,orderId:$('ret_orderId').value.trim(),productName:$('ret_product').value.trim(),sku:$('ret_sku').value.trim(),qtyReturned,originalSellingPrice:+$('ret_price').value,totalReturnedAmount:+totalReturnedAmount.toFixed(2),serviceFee:+serviceFee.toFixed(2),otherCharges:+otherCharges.toFixed(2),reason:$('ret_reason').value.trim(),status,notes:$('ret_notes').value.trim(),ownerId:currentOwnerId(),updatedAt:Date.now()};try{if(id){rec.id=id;await put('returns',rec);await audit('UPDATE_RETURN',{id});}else{if('id' in rec)delete rec.id;try{await add('returns',rec);}catch(addErr){if(addErr&&addErr.name==='DataError'){rec.id=Date.now();await put('returns',rec);}else throw addErr;}await audit('CREATE_RETURN',{productName:rec.productName,amount:rec.totalReturnedAmount});}await loadAll();closeModal();renderReturns();toast('✓ Return saved. Reports updated.','success');scheduleBackup();}catch(err){console.error(err);errEl.innerHTML='<div class="alert alert-error">Database error: '+(err.message||err)+'</div>';toast('Return not saved','error');}finally{btnLoading(saveBtn,false);State.saving=false;}};}
function updateReturnCalc(){const qty=+$('ret_qty')?.value||0;const price=+$('ret_price')?.value||0;const serviceFee=+$('ret_serviceFee')?.value||0;const otherCharges=+$('ret_otherCharges')?.value||0;const total=qty*price;const netImpact=total+serviceFee+otherCharges;const el=$('retCalcPreview');if(el){el.innerHTML=`<div>Qty × Price: ${qty} × ${fmt(price)} = <b>${fmt(total)}</b></div><div>+ Service Fee: ${fmt(serviceFee)}</div><div>+ Other Charges: ${fmt(otherCharges)}</div><div class="divider"></div><div>Total Return Impact: <b class="danger">${fmt(netImpact)}</b></div><div class="muted" style="font-size:10px;margin-top:4px">This amount will be deducted from Net Sales and Net Profit.</div>`;}}
async function searchOriginalSale(){const query=$('ret_searchSale').value.trim().toLowerCase();const mktId=+$('ret_mkt').value;if(!query){toast('Enter search term','error');return;}const results=State.sales.filter(s=>{if(mktId&&String(s.mktId)!==String(mktId))return false;return(s.orderNum||'').toLowerCase().includes(query)||(s.sku||'').toLowerCase().includes(query)||(s.product||'').toLowerCase().includes(query);}).slice(0,5);const resultsEl=$('ret_searchResults');if(!results.length){resultsEl.innerHTML='<div class="muted" style="font-size:12px">No matching sales found.</div>';return;}resultsEl.innerHTML='<div style="font-size:12px;margin-bottom:4px"><b>Click to link:</b></div>'+results.map(s=>{const m=State.mkt.find(x=>x.id==s.mktId);const alreadyReturned=State.returns.filter(r=>r.originalSaleId===s.id).reduce((sum,r)=>sum+num(r.qtyReturned),0);const remaining=num(s.qty)-alreadyReturned;return `<div style="padding:6px;margin:4px 0;background:var(--panel2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px" onclick="linkToSale(${s.id})"><b>${esc(s.orderNum)}</b> · ${esc(s.product)} · ${esc(m?.name||'')} · ${fmtDate(s.saleDate)}<br><span class="muted">Qty: ${s.qty} (${remaining} remaining) · Price: ${fmt(s.price)}</span></div>`;}).join('');}
function linkToSale(saleId){const sale=State.sales.find(s=>s.id===saleId);if(!sale)return;$('ret_origSaleId').value=sale.id;$('ret_origDate').value=sale.saleDate;$('ret_orderId').value=sale.orderNum;$('ret_product').value=sale.product;$('ret_sku').value=sale.sku||'';$('ret_price').value=sale.price;$('ret_mkt').value=sale.mktId;const alreadyReturned=State.returns.filter(r=>r.originalSaleId===sale.id).reduce((sum,r)=>sum+num(r.qtyReturned),0);const remaining=num(sale.qty)-alreadyReturned;$('ret_qty').value=Math.min(1,remaining);$('ret_qty').max=remaining;updateReturnCalc();$('ret_searchResults').innerHTML=`<div class="alert alert-success" style="font-size:12px">✓ Linked to sale #${sale.id} (${remaining} unit(s) remaining)</div>`;toast('Sale linked','success');}
function viewReturn(id){const r=State.returns.find(x=>x.id===id);if(!r)return;const m=State.mkt.find(x=>x.id==r.marketplaceId);const origSale=r.originalSaleId?State.sales.find(s=>s.id===r.originalSaleId):null;openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">Return #${r.id}</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="grid grid-2"><div><div class="muted" style="font-size:10px">Marketplace</div><div>${mktBadge(m)}</div><div class="muted" style="font-size:10px;margin-top:6px">Return Date</div><div>${esc(fmtDate(r.returnDate))}</div><div class="muted" style="font-size:10px;margin-top:6px">Status</div><div>${statusPill(r.status)}</div><div class="muted" style="font-size:10px;margin-top:6px">Product</div><div>${esc(r.productName)}</div><div class="muted" style="font-size:10px;margin-top:6px">SKU</div><div>${esc(r.sku||'-')}</div><div class="muted" style="font-size:10px;margin-top:6px">Quantity Returned</div><div>${r.qtyReturned}</div>${origSale?`<div class="muted" style="font-size:10px;margin-top:6px">Original Sale</div><div><a class="link" onclick="viewSale(${origSale.id})">#${origSale.id} - ${esc(origSale.orderNum)}</a></div>`:'<div class="muted" style="font-size:10px;margin-top:6px">Original Sale</div><div class="warn">Unlinked return</div>'}</div><div style="background:var(--panel2);border:1px dashed var(--border);border-radius:7px;padding:10px;font-family:monospace;font-size:11px"><div>Original Selling Price: ${fmt(r.originalSellingPrice)}</div><div>Qty Returned: ${r.qtyReturned}</div><div class="divider"></div><div>Total Returned Amount: <b class="danger">${fmt(r.totalReturnedAmount)}</b></div><div>Service Fee: <b class="warn">${fmt(r.serviceFee)}</b></div><div>Other Charges: <b class="warn">${fmt(r.otherCharges)}</b></div><div class="divider"></div><div>Total Impact: <b class="danger">${fmt(num(r.totalReturnedAmount)+num(r.serviceFee)+num(r.otherCharges))}</b></div>${r.reason?`<div class="divider"></div><div>Reason: ${esc(r.reason)}</div>`:''}${r.notes?`<div>Notes: ${esc(r.notes)}</div>`:''}</div></div>`);}
async function deleteReturn(id){if(!confirm('Delete this return? Financial totals will be recalculated.'))return;await del('returns',id);await audit('DELETE_RETURN',{id});await loadAll();renderReturns();toast('Return deleted. Totals recalculated.','success');scheduleBackup();}
function exportReturns(){const rows=State.returns.map(r=>{const m=State.mkt.find(x=>x.id==r.marketplaceId);return{ReturnID:r.id,ReturnDate:fmtDate(r.returnDate),Marketplace:m?.name||'',OriginalSaleID:r.originalSaleId||'',OrderID:r.orderId||'',Product:r.productName||'',SKU:r.sku||'',QtyReturned:r.qtyReturned,OriginalPrice:r.originalSellingPrice,TotalReturned:r.totalReturnedAmount,ServiceFee:r.serviceFee,OtherCharges:r.otherCharges,Reason:r.reason||'',Status:r.status||'',Notes:r.notes||''};});const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Returns');XLSX.writeFile(wb,`returns-${Date.now()}.xlsx`);toast('Exported','success');}

function renderMkt(){$('view').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Marketplaces</h3><button class="btn btn-primary" onclick="editMkt(null)">+ New</button></div><div class="grid grid-3" id="mkt_grid"></div></div>`;drawMkt();}
function drawMkt(){$('mkt_grid').innerHTML=State.mkt.map(m=>{const f=marketplaceFinancials(m.id);return `<div class="card" style="border-left:3px solid ${m.brandColor||'var(--user-accent, var(--primary))'};margin:0"><div style="display:flex;justify-content:space-between;align-items:start"><div style="display:flex;gap:6px;align-items:center">${mktLogo(m,34)}<div><div style="font-weight:800">${esc(m.name)}</div><div class="muted" style="font-size:10px">${esc(m.storeName||'No store')}</div>${m.active===false?'<span class="pill">Inactive</span>':'<span class="pill success">Active</span>'}</div></div><div class="row-actions"><button class="btn btn-sm" onclick="editMkt(${m.id})"></button><button class="btn btn-sm" onclick="toggleMkt(${m.id})">${m.active===false?'▶':'⏸'}</button></div></div><div class="divider"></div><div class="grid grid-2" style="gap:4px"><div><div class="muted" style="font-size:9px">Total Sales</div><div style="color:var(--user-accent, var(--primary));font-weight:800">${fmt(f.sales)}</div></div><div><div class="muted" style="font-size:9px">Total Profit</div><div class="${f.profit>=0?'success':'danger'}" style="font-weight:800">${fmt(f.profit)}</div></div><div><div class="muted" style="font-size:9px">W/D Balance</div><div style="font-weight:800">${fmt(f.withdrawalBalance)}</div></div><div><div class="muted" style="font-size:9px">Total Withdrawn</div><div class="success" style="font-weight:800">${fmt(f.totalWithdrawn)}</div></div><div><div class="muted" style="font-size:9px">Available</div><div class="warn" style="font-weight:800">${fmt(f.available)}</div></div><div><div class="muted" style="font-size:9px">Returns</div><div class="danger" style="font-weight:800">${fmt(f.totalReturns)}</div></div></div></div>`;}).join('')||'<div class="muted">No marketplaces.</div>';}
async function toggleMkt(id){const m=State.mkt.find(x=>x.id===id);if(!m)return;m.active=m.active===false;await put('mkt',m);await loadAll();drawMkt();toast('Updated','success');}
function editMkt(id){const m=id?State.mkt.find(x=>x.id===id):{name:'',code:'',active:true,currency:'AED',storeName:'',storeCode:'',logoDataUrl:'',brandColor:'#111',notes:''};let currentLogo=m.logoDataUrl||'';openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">${id?'Edit':'New'} Marketplace</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="grid grid-2"><div><label>Name *</label><input class="input" id="m_name" value="${esc(m.name)}"></div><div><label>Code</label><input class="input" id="m_code" value="${esc(m.code||'')}"></div><div><label>Store Name</label><input class="input" id="m_storeName" value="${esc(m.storeName||'')}"></div><div><label>Store Code</label><input class="input" id="m_storeCode" value="${esc(m.storeCode||'')}"></div><div><label>Currency</label><input class="input" id="m_currency" value="${esc(m.currency||'AED')}"></div><div><label>Status</label><select class="input" id="m_active"><option value="true" ${m.active!==false?'selected':''}>Active</option><option value="false" ${m.active===false?'selected':''}>Inactive</option></select></div><div><label>Brand Colour</label><input type="color" class="input" id="m_color" value="${m.brandColor||'#111111'}" style="height:38px;padding:3px"></div><div><label>Logo (PNG/JPEG/WebP, max 2MB)</label><input type="file" id="m_logoFile" accept="image/png,image/jpeg,image/webp" class="input"></div><div style="grid-column:span 2;display:flex;gap:6px;align-items:center"><div id="m_logoPreview" style="width:60px;height:60px;border:1px solid var(--border);border-radius:7px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden">${currentLogo?`<img src="${currentLogo}" style="width:100%;height:100%;object-fit:contain">`:'<span class="muted" style="font-size:9px">No logo</span>'}</div><button class="btn btn-sm" type="button" onclick="window._tmpLogo='';$('m_logoPreview').innerHTML='<span class=\\'muted\\' style=\\'font-size:9px\\'>No logo</span>'">Remove Logo</button></div><div style="grid-column:span 2"><label>Notes</label><textarea class="input" id="m_notes">${esc(m.notes||'')}</textarea></div></div><div style="margin-top:10px;display:flex;gap:4px;justify-content:flex-end">${id?`<button class="btn btn-danger" onclick="delMkt(${id})">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="m_saveBtn" onclick="saveMkt(${id||'null'})">Save</button></div>`);$('m_logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Max 2MB','error');return;}const r=new FileReader();r.onload=ev=>{currentLogo=ev.target.result;window._tmpLogo=currentLogo;$('m_logoPreview').innerHTML=`<img src="${currentLogo}" style="width:100%;height:100%;object-fit:contain">`;};r.readAsDataURL(f);};}
async function saveMkt(id){const name=$('m_name').value.trim();if(!name){toast('Name required','error');return;}const btn=$('m_saveBtn');btnLoading(btn,true);const rec={id:id||undefined,name,code:$('m_code').value.trim(),storeName:$('m_storeName').value.trim(),storeCode:$('m_storeCode').value.trim(),currency:$('m_currency').value.trim()||'AED',active:$('m_active').value==='true',notes:$('m_notes').value.trim(),brandColor:$('m_color').value||'#111',logoDataUrl:window._tmpLogo||(id?State.mkt.find(x=>x.id===id)?.logoDataUrl||'':''),ownerId:currentOwnerId(),updatedAt:Date.now()};try{if(id)await put('mkt',rec);else{delete rec.id;rec.createdAt=Date.now();await add('mkt',rec);}await loadAll();closeModal();drawMkt();toast('Saved','success');window._tmpLogo=null;}catch(err){toast('Save failed: '+err.message,'error');}finally{btnLoading(btn,false);}}
async function delMkt(id){if(State.sales.some(s=>String(s.mktId)===String(id))){toast('Has sales history, cannot delete','error');return;}if(!confirm('Delete?'))return;await del('mkt',id);await loadAll();closeModal();drawMkt();}

function renderProducts(){$('view').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Products</h3><button class="btn btn-primary" onclick="editProduct(null)">+ New</button></div><div class="alert alert-info" style="font-size:12px">Products are automatically saved when you create a sale with a new product name or SKU.</div><div class="table-wrap"><table class="data" id="p_table"></table></div></div>`;$('p_table').innerHTML=`<thead><tr><th>SKU</th><th>Name</th><th>Brand</th><th>Cost</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${State.products.length?State.products.map(p=>`<tr><td>${esc(p.sku||'')}</td><td>${esc(p.name||'')}</td><td>${esc(p.brand||'')}</td><td>${fmt(p.defaultCost||0)}</td><td>${fmt(p.defaultPrice||0)}</td><td>${p.active!==false?'<span class="pill success">Active</span>':'<span class="pill">Inactive</span>'}</td><td><div class="row-actions"><button class="btn btn-sm" onclick="editProduct(${p.id})">✎</button><button class="btn btn-danger btn-sm" onclick="delProduct(${p.id})">✕</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:16px">No products yet. Products will appear here automatically when you create sales.</td></tr>'}</tbody>`;}
function editProduct(id){const p=id?State.products.find(x=>x.id===id):{sku:'',name:'',brand:'',category:'',defaultCost:0,defaultPrice:0,active:true,notes:''};openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">${id?'Edit':'New'} Product</h3><button class="btn" onclick="closeModal()">Close</button></div><form id="pf"><div class="grid grid-3"><div><label>SKU *</label><input class="input" id="p_sku" value="${esc(p.sku||'')}" required></div><div><label>Name *</label><input class="input" id="p_name" value="${esc(p.name||'')}" required></div><div><label>Brand</label><input class="input" id="p_brand" value="${esc(p.brand||'')}"></div><div><label>Default Cost</label><input type="number" step="0.01" class="input" id="p_cost" value="${p.defaultCost||0}"></div><div><label>Default Price</label><input type="number" step="0.01" class="input" id="p_price" value="${p.defaultPrice||0}"></div><div><label>Status</label><select class="input" id="p_active"><option value="true" ${p.active!==false?'selected':''}>Active</option><option value="false" ${p.active===false?'selected':''}>Inactive</option></select></div></div><div style="margin-top:10px;display:flex;gap:4px;justify-content:flex-end"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`);$('pf').onsubmit=async e=>{e.preventDefault();const sku=$('p_sku').value.trim(),name=$('p_name').value.trim();if(!sku||!name){toast('SKU and Name required','error');return;}const rec={id:id||undefined,sku,name,brand:$('p_brand').value.trim(),defaultCost:+$('p_cost').value||0,defaultPrice:+$('p_price').value||0,active:$('p_active').value==='true',notes:$('p_notes')?.value||'',ownerId:currentOwnerId()};if(id)await put('products',rec);else{delete rec.id;rec.createdAt=Date.now();await add('products',rec);}await loadAll();closeModal();renderProducts();toast('Saved','success');};}
async function delProduct(id){if(!confirm('Delete?'))return;await del('products',id);await loadAll();renderProducts();}

function renderSett(){const expected=State.sales.reduce((a,s)=>a+num(s.wd)*revenueTreatment(s.orderStatus),0);const received=State.sett.reduce((a,s)=>a+num(s.actual),0);const pending=Math.max(0,expected-received);$('view').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px"><h3 style="margin:0">Withdrawals & Settlements</h3><div style="display:flex;gap:4px"><button class="btn" onclick="exportSett()">⬇ Export</button><button class="btn btn-primary" onclick="editSett(null)">+ New Withdrawal</button></div></div><div class="alert alert-info">Each withdrawal is linked to a marketplace. Available = W/D Balance − Total Withdrawn.</div><div class="kpi-grid"><div class="kpi"><div class="kpi-label">Expected</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(expected)}</div></div><div class="kpi"><div class="kpi-label">Received</div><div class="kpi-value success">${fmt(received)}</div></div><div class="kpi"><div class="kpi-label">Pending</div><div class="kpi-value warn">${fmt(pending)}</div></div><div class="kpi"><div class="kpi-label">Transactions</div><div class="kpi-value">${State.sett.length}</div></div></div><div class="table-wrap"><table class="data" id="sett_table"></table></div></div>`;drawSett();}
function drawSett(){$('sett_table').innerHTML=`<thead><tr><th>Date</th><th>Marketplace</th><th>Reference</th><th>Expected</th><th>Actual</th><th>Diff</th><th>Status</th><th>Actions</th></tr></thead><tbody>${State.sett.length?State.sett.slice().sort((a,b)=>(b.withdrawalDate||'').localeCompare(a.withdrawalDate||'')).map(s=>{const m=State.mkt.find(x=>x.id==s.mktId);const diff=num(s.actual)-num(s.expected);return `<tr><td class="nowrap">${esc(fmtDate(s.withdrawalDate))}</td><td>${mktBadge(m)}</td><td>${esc(s.ref||'')}</td><td>${fmt(s.expected)}</td><td>${fmt(s.actual)}</td><td class="${diff>=0?'success':'danger'}"><b>${fmt(diff)}</b></td><td>${statusPill(s.status)}</td><td><div class="row-actions"><button class="btn btn-sm" onclick="editSett(${s.id})">Edit</button><button class="btn btn-danger btn-sm" onclick="delSett(${s.id})">✕</button></div></td></tr>`;}).join(''):'<tr><td colspan="8" class="muted" style="text-align:center;padding:16px">No withdrawals yet.</td></tr>'}</tbody>`;}
function editSett(id){const s=id?State.sett.find(x=>x.id===id):{mktId:'',ref:'',period:'',expected:'',actual:'',withdrawalDate:today(),bankRef:'',status:'Pending',notes:''};if(id&&!s){toast('Not found','error');return;}const mopts=State.mkt.map(m=>`<option value="${m.id}" ${String(m.id)===String(s.mktId)?'selected':''}>${esc(m.name)}</option>`).join('');const statuses=State.settings.settlementStatuses||['Pending','Partially Settled','Settled','Disputed','On Hold'];const selectedMktId=s.mktId||(State.mkt[0]?.id||'');const fin=selectedMktId?marketplaceFinancials(selectedMktId):null;openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">${id?'Edit':'New'} Withdrawal</h3><button class="btn" onclick="closeModal()">Close</button></div><div id="settErr" style="min-height:0;font-size:12px;margin-bottom:8px"></div><div id="settBalanceInfo" class="alert alert-info" style="${fin?'':'display:none'}"><b>Selected Marketplace Balance:</b><br>W/D Balance: <b>${fmt(fin?.withdrawalBalance||0)}</b> · Withdrawn: <b class="success">${fmt(fin?.totalWithdrawn||0)}</b> · Available: <b class="warn">${fmt(fin?.available||0)}</b></div><form id="sf2"><div class="grid grid-3"><div><label>Marketplace *</label><select class="input" id="st_mkt" required><option value="">Select...</option>${mopts}</select></div><div><label>Reference *</label><input class="input" id="st_ref" value="${esc(s.ref||'')}" required></div><div><label>Withdrawal Date *</label><input type="date" class="input" id="st_date" value="${esc(s.withdrawalDate||today())}" required></div><div><label>Expected Amount *</label><input type="number" step="0.01" class="input" id="st_exp" value="${s.expected??''}" required></div><div><label>Actual Received</label><input type="number" step="0.01" class="input" id="st_act" value="${s.actual??''}"></div><div><label>Status *</label><select class="input" id="st_status">${statuses.map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Period</label><input class="input" id="st_period" value="${esc(s.period||'')}"></div><div><label>Bank Ref</label><input class="input" id="st_bank" value="${esc(s.bankRef||'')}"></div><div><label>Store Code</label><input class="input" id="st_store" value="${esc(s.storeCode||'')}"></div><div style="grid-column:span 2"><label>Notes</label><textarea class="input" id="st_notes">${esc(s.notes||'')}</textarea></div></div><div style="margin-top:10px;display:flex;gap:4px;justify-content:flex-end"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit" id="st_save">💾 Save Withdrawal</button></div></form>`);$('st_mkt').onchange=()=>{const mid=+$('st_mkt').value;const m=State.mkt.find(x=>x.id==mid);const store=$('st_store');if(m&&!store.value)store.value=m.storeCode||'';const f=mid?marketplaceFinancials(mid):null;const info=$('settBalanceInfo');if(f&&info){info.style.display='';info.innerHTML=`<b>Selected Marketplace Balance:</b><br>W/D Balance: <b>${fmt(f.withdrawalBalance)}</b> · Withdrawn: <b class="success">${fmt(f.totalWithdrawn)}</b> · Available: <b class="warn">${fmt(f.available)}</b>`;}else if(info)info.style.display='none';};$('sf2').onsubmit=async e=>{e.preventDefault();if(State.saving)return;State.saving=true;const errEl=$('settErr');errEl.innerHTML='';const saveBtn=$('st_save');btnLoading(saveBtn,true);const marketplaceId=+$('st_mkt').value,ref=$('st_ref').value.trim(),withdrawalDate=$('st_date').value;const expectedRaw=$('st_exp').value,actualRaw=$('st_act').value,status=$('st_status').value;const errors=[];if(!marketplaceId)errors.push('Marketplace required');if(!ref)errors.push('Reference required');if(!withdrawalDate)errors.push('Date required');const expectedAmount=Number(expectedRaw),actualAmount=actualRaw===''?0:Number(actualRaw);if(expectedRaw===''||!Number.isFinite(expectedAmount)||expectedAmount<0)errors.push('Expected must be ≥ 0');if(!Number.isFinite(actualAmount)||actualAmount<0)errors.push('Actual must be ≥ 0');const dup=State.sett.find(x=>x.id!==id&&x.mktId==marketplaceId&&x.ref===ref&&x.withdrawalDate===withdrawalDate);if(dup)errors.push('Duplicate withdrawal exists');if(errors.length){errEl.innerHTML='<div class="alert alert-error">'+errors.map(e=>'• '+e).join('<br>')+'</div>';toast('Validation failed','error');btnLoading(saveBtn,false);State.saving=false;return;}const rec={mktId:marketplaceId,storeCode:$('st_store').value.trim(),ref,period:$('st_period').value.trim(),expected:+expectedAmount.toFixed(2),actual:+actualAmount.toFixed(2),withdrawalDate,bankRef:$('st_bank').value.trim(),status,notes:$('st_notes').value.trim(),ownerId:currentOwnerId(),updatedAt:Date.now()};try{if(id){rec.id=id;await put('sett',rec);await audit('UPDATE_SETT',{id,ref,mktId:marketplaceId});}else{if('id' in rec)delete rec.id;try{await add('sett',rec);}catch(addErr){if(addErr&&addErr.name==='DataError'){rec.id=Date.now();await put('sett',rec);}else throw addErr;}await audit('CREATE_SETT',{ref,mktId:marketplaceId,actual:actualAmount});}await loadAll();closeModal();renderSett();toast('✓ Withdrawal saved. Balance updated.','success');scheduleBackup();}catch(err){console.error(err);errEl.innerHTML='<div class="alert alert-error">Database error: '+(err.message||err)+'</div>';toast('Not saved','error');}finally{btnLoading(saveBtn,false);State.saving=false;}};}
async function delSett(id){if(!confirm('Delete this withdrawal?'))return;await del('sett',id);await loadAll();renderSett();toast('Deleted','success');}
function exportSett(){const rows=State.sett.map(s=>{const m=State.mkt.find(x=>x.id==s.mktId);return{Date:fmtDate(s.withdrawalDate),Marketplace:m?.name||'',Ref:s.ref||'',Expected:s.expected,Actual:s.actual,Diff:num(s.actual)-num(s.expected),Status:s.status||''};});const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Settlements');XLSX.writeFile(wb,`settlements-${Date.now()}.xlsx`);toast('Exported','success');}

/* Reports */
function getWeekRange(d){const date=new Date(d);const day=date.getDay();const diff=date.getDate()-day+(day===0?-6:1);const monday=new Date(date.setDate(diff));const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return{start:monday.toISOString().slice(0,10),end:sunday.toISOString().slice(0,10)};}
function renderWeekly(){const now=new Date();const week=getWeekRange(now);$('view').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Weekly Report</h3><div class="grid grid-4" style="align-items:end"><div><label>Week Start</label><input type="date" class="input" id="wk_start" value="${week.start}"></div><div><label>Week End</label><input type="date" class="input" id="wk_end" value="${week.end}"></div><div><label>Marketplace</label><select class="input" id="wk_mkt"><option value="">All</option>${State.mkt.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div style="display:flex;gap:4px"><button class="btn btn-primary" onclick="drawWeekly()">Apply</button><button class="btn" onclick="exportWeeklyPDF()"> PDF</button></div></div></div><div id="wk_out"></div>`;drawWeekly();}
function drawWeekly(){const start=$('wk_start').value,end=$('wk_end').value,mid=$('wk_mkt').value;const salesFilter=s=>{const d=fmtDate(s.saleDate);if(!d||d<start||d>end)return false;if(mid&&String(s.mktId)!==String(mid))return false;return true;};const rows=State.sales.filter(salesFilter);const returns=State.returns.filter(r=>{const d=fmtDate(r.returnDate);if(!d||d<start||d>end)return false;if(mid&&String(r.marketplaceId)!==String(mid))return false;return true;});const agg=aggregateWithReturns(rows,returns);const byMkt=State.mkt.map(m=>{const mrows=rows.filter(r=>String(r.mktId)===String(m.id));const mret=returns.filter(r=>String(r.marketplaceId)===String(m.id));const a=aggregateWithReturns(mrows,mret);const st=State.sett.filter(x=>String(x.mktId)===String(m.id));const withdrawn=st.reduce((a,x)=>a+num(x.actual),0);return{name:m.name,...a,withdrawn:+withdrawn.toFixed(2),available:+Math.max(0,a.netWithdrawal-withdrawn).toFixed(2)};}).filter(x=>x.orders>0||x.returnCount>0);$('wk_out').innerHTML=`<div class="kpi-grid"><div class="kpi"><div class="kpi-label">Period</div><div class="kpi-value" style="font-size:14px">${esc(start)} → ${esc(end)}</div></div><div class="kpi"><div class="kpi-label">Gross Sales</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(agg.gross)}</div></div><div class="kpi"><div class="kpi-label">Returns</div><div class="kpi-value danger">${fmt(agg.totalReturns)}</div></div><div class="kpi"><div class="kpi-label">Net Sales</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(agg.netSales)}</div></div><div class="kpi"><div class="kpi-label">Net Profit</div><div class="kpi-value ${agg.netProfit>=0?'success':'danger'}">${fmt(agg.netProfit)}</div></div><div class="kpi"><div class="kpi-label">Orders</div><div class="kpi-value">${agg.orders}</div></div></div><div class="card"><h3>Marketplace Breakdown</h3><div class="table-wrap"><table class="data"><thead><tr><th>Marketplace</th><th>Orders</th><th>Gross</th><th>Returns</th><th>Net Sales</th><th>Net Profit</th><th>Withdrawn</th><th>Available</th></tr></thead><tbody>${byMkt.length?byMkt.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.orders}</td><td>${fmt(x.gross)}</td><td class="danger">${fmt(x.totalReturns)}</td><td>${fmt(x.netSales)}</td><td class="${x.netProfit>=0?'success':'danger'}">${fmt(x.netProfit)}</td><td class="success">${fmt(x.withdrawn)}</td><td class="warn">${fmt(x.available)}</td></tr>`).join(''):'<tr><td colspan="8" class="muted" style="text-align:center;padding:16px">No data for this period.</td></tr>'}</tbody></table></div></div>`;}
function exportWeeklyPDF(){const start=$('wk_start').value,end=$('wk_end').value,mid=$('wk_mkt').value;const rows=State.sales.filter(s=>{const d=fmtDate(s.saleDate);return d&&d>=start&&d<=end&&(!mid||String(s.mktId)===String(mid));});const returns=State.returns.filter(r=>{const d=fmtDate(r.returnDate);return d&&d>=start&&d<=end&&(!mid||String(r.marketplaceId)===String(mid));});const agg=aggregateWithReturns(rows,returns);const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(17,17,17);doc.rect(0,0,210,28,'F');doc.setTextColor(255,255,255);doc.setFontSize(15);doc.text('E SMART ELECTRONICS',14,13);doc.setFontSize(11);doc.text(`Weekly Report — ${start} to ${end}`,14,21);doc.setTextColor(20,20,20);doc.setFontSize(9);doc.text('Generated: '+new Date().toLocaleString(),14,36);doc.autoTable({startY:44,head:[['Metric','Value']],body:[['Period',`${start} to ${end}`],['Gross Sales',fmt(agg.gross)],['Returns',fmt(agg.totalReturns)],['Net Sales',fmt(agg.netSales)],['Total Orders',agg.orders],['Quantity',agg.qty],['Product Cost',fmt(agg.cost)],['Total Fees',fmt(agg.fees)],['Return Service Fees',fmt(agg.totalServiceFees)],['Withdrawal Balance',fmt(agg.netWithdrawal)],['Net Profit',fmt(agg.netProfit)],['Profit Margin',agg.margin.toFixed(2)+'%']],theme:'grid',headStyles:{fillColor:[17,17,17]}});doc.save(`weekly-report-${start}-to-${end}.pdf`);toast('PDF exported','success');}

function renderMonthly(){const years=[...new Set(State.sales.map(s=>yearKey(s.saleDate)).filter(Boolean))].sort().reverse();const cy=String(new Date().getFullYear());if(!years.includes(cy))years.unshift(cy);$('view').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Monthly Report</h3><div class="grid grid-4" style="align-items:end"><div><label>Year</label><select class="input" id="mo_year">${years.map(y=>`<option ${y===cy?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Month</label><select class="input" id="mo_month">${['January','February','March','April','May','June','July','August','September','October','November','December'].map((m,i)=>`<option value="${i+1}" ${i+1===new Date().getMonth()+1?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Marketplace</label><select class="input" id="mo_mkt"><option value="">All</option>${State.mkt.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div style="display:flex;gap:4px"><button class="btn btn-primary" onclick="drawMonthly()">Apply</button><button class="btn" onclick="exportMonthlyExcel()">⬇ Excel</button><button class="btn" onclick="exportMonthlyPDF()">⬇ PDF</button></div></div></div><div id="mo_out"></div>`;drawMonthly();}
function drawMonthly(){const y=+$('mo_year').value,m=+$('mo_month').value,mid=$('mo_mkt').value;const salesFilter=s=>{const d=parseDate(s.saleDate);if(!d)return false;return d.getFullYear()===y&&d.getMonth()+1===m&&(!mid||String(s.mktId)===String(mid));};const rows=State.sales.filter(salesFilter);const returns=State.returns.filter(r=>{const d=parseDate(r.returnDate);if(!d)return false;return d.getFullYear()===y&&d.getMonth()+1===m&&(!mid||String(r.marketplaceId)===String(mid));});const agg=aggregateWithReturns(rows,returns);const byMkt=State.mkt.map(mk=>{const mrows=rows.filter(r=>String(r.mktId)===String(mk.id));const mret=returns.filter(r=>String(r.marketplaceId)===String(mk.id));const a=aggregateWithReturns(mrows,mret);const st=State.sett.filter(x=>String(x.mktId)===String(mk.id));const withdrawn=st.reduce((a,x)=>a+num(x.actual),0);return{name:mk.name,...a,withdrawn:+withdrawn.toFixed(2),available:+Math.max(0,a.netWithdrawal-withdrawn).toFixed(2)};}).filter(x=>x.orders>0||x.returnCount>0);$('mo_out').innerHTML=`<div class="card"><h3>${['','January','February','March','April','May','June','July','August','September','October','November','December'][m]} ${y}</h3><table class="data"><tbody><tr><td>Gross Sales</td><td style="text-align:right;color:var(--user-accent, var(--primary));font-weight:800">${fmt(agg.gross)}</td></tr><tr><td>Returns</td><td style="text-align:right" class="danger">${fmt(agg.totalReturns)}</td></tr><tr><td>Net Sales</td><td style="text-align:right;color:var(--user-accent, var(--primary));font-weight:800">${fmt(agg.netSales)}</td></tr><tr><td>Orders</td><td style="text-align:right">${agg.orders}</td></tr><tr><td>Qty</td><td style="text-align:right">${agg.qty}</td></tr><tr><td>Cost</td><td style="text-align:right">${fmt(agg.cost)}</td></tr><tr><td>Fees</td><td style="text-align:right">${fmt(agg.fees)}</td></tr><tr><td>Return Service Fees</td><td style="text-align:right" class="warn">${fmt(agg.totalServiceFees)}</td></tr><tr><td>Withdrawal</td><td async function doImport(){const f=$('impFile').files[0];if(!f){toast('Choose file','error');return;}const btn=$('impBtn');btnLoading(btn,true);try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});let added=0,skipped=0;for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false});for(const r of rows){const orderNum=r['ORDER ID']||r['ORDER NUMBER']||r['Order Number']||r['Order ID'];if(!orderNum)continue;if(State.sales.some(s=>s.orderNum===String(orderNum))){skipped++;continue;}const date=r['DATE']||r['Date'];let d;if(date instanceof Date)d=date.toISOString().slice(0,10);else if(typeof date==='number')d=new Date(Math.round((date-25569)*86400000)).toISOString().slice(0,10);else{const p=new Date(date);d=isNaN(p)?today():p.toISOString().slice(0,10);}let mktId=+$('impMkt').value;if(!mktId){const g=(sn+' '+f.name).toLowerCase();const found=State.mkt.find(m=>g.includes(m.name.toLowerCase()));mktId=found?found.id:State.mkt[0]?.id||1;}const rec={saleDate:d,mktId,orderNum:String(orderNum),product:r['PRODUCT']||r['Product']||'',sku:r['STORE CODE']||r['SKU']||'',txn:r['Transaction ID']||'',qty:+(r['QTY']||r['Qty']||1),price:+(r['SELLING PRICE']||r['Selling Price']||0),pcost:+(r['COST']||r['Cost']||0),refFee:+(r['Commission Fees']||r['Commission']||0),shipFee:+(r['Shipping Fee']||0),outFee:+(r['Closing Fees']||0),othFee:0,refund:0,orderStatus:r['STATUS']||'Delivered',payStatus:'Pending',ownerId:currentOwnerId(),createdAt:Date.now()};Object.assign(rec,calcSale(rec));await add('sales',rec);added++;}}await loadAll();$('impOut').innerHTML=`<div class="card" style="background:var(--panel2)"><b class="success">✓ Imported ${added}</b> · Skipped ${skipped} duplicates</div>`;toast(`Imported ${added}`,'success');scheduleBackup();}catch(err){toast('Import failed: '+err.message,'error');}finally{btnLoading(btn,false);}}

const BackupManager={intervalId:null,isRunning:false,retryCount:0,maxRetries:3,lastSuccess:null,lastAttempt:null,lastError:null,start(){this.stop();if(!State.settings.autoBackup)return;const freq=Math.max(60,State.settings.backupFrequency||300)*1000;this.intervalId=setInterval(()=>this.run(),freq);setTimeout(()=>this.run(),3000);},stop(){if(this.intervalId){clearInterval(this.intervalId);this.intervalId=null;}},async run(){if(this.isRunning)return;this.isRunning=true;this.lastAttempt=new Date();await saveSetting('lastBackupAttempt',this.lastAttempt.toLocaleString());try{if(State.settings.backupFolderName&&!State.backupHandle){throw new Error('Folder permission lost. Please reconnect.');}if(State.backupHandle){if(typeof State.backupHandle.queryPermission==='function'){const permission=await State.backupHandle.queryPermission({mode:'readwrite'});if(permission!=='granted'){const request=await State.backupHandle.requestPermission({mode:'readwrite'});if(request!=='granted'){throw new Error('Folder permission denied');}}}}await performBackup();this.lastSuccess=new Date();this.lastError=null;this.retryCount=0;await saveSetting('lastBackupTime',this.lastSuccess.toLocaleString());await saveSetting('lastBackupStatus','Success');}catch(err){this.lastError=err.message;this.retryCount++;await saveSetting('lastBackupStatus',`Error: ${err.message}`);if(this.retryCount>=this.maxRetries){this.stop();await saveSetting('lastBackupStatus',`Stopped after ${this.maxRetries} failures. Reconnect folder.`);await saveSetting('autoBackup',false);}}finally{this.isRunning=false;}},getStatus(){if(this.isRunning)return{state:'running',text:'Backup In Progress'};if(!State.settings.autoBackup)return{state:'disabled',text:'Disabled by User'};if(!State.settings.backupFolderName)return{state:'warning',text:'Folder Not Selected'};if(!State.backupHandle)return{state:'warning',text:'Permission Required'};if(this.lastError)return{state:'error',text:`Error: ${this.lastError}`};return{state:'active',text:'Enabled — Backup Working'};}};

/* ============================================================
   AI BUSINESS ASSISTANT — LOCAL DETERMINISTIC ENGINE
   Works offline. No API keys required.

// Malayalam business vocabulary
const ML_KEYWORDS = {
  sales: ['വിൽപ്പന', 'വ്യാപാരം', 'sales', 'sell'],
  profit: ['ലാഭം', 'നേട്ടം', 'profit'],
  loss: ['നഷ്ടം', 'loss'],
  today: ['ഇന്ന്', 'today'],
  month: ['മാസം', 'month'],
  year: ['വർഷം', 'year'],
  compare: ['താരതമ്യം', 'compare', 'vs'],
  return: ['തിരിച്ചുനൽകൽ', 'റിട്ടേൺ', 'return'],
  pending: ['ബാക്കി', 'തീരാത്ത', 'pending'],
  settlement: ['സെറ്റിൽമെന്റ്', 'settlement'],

  product: ['ഉൽപ്പന്നം', 'product'],
  fee: ['ഫീസ്', 'fee', 'commission'],
  cost: ['ചെലവ്', 'cost'],
};

const AIAssistant = {
  conversation: [],
  maxHistory: 50,
  
  // Intent patterns with priority
  intents: [
    { id: 'daily_summary', patterns: [/today|ഇന്ന്|ദൈനംദിന|daily summary|summarize today/i], priority: 10 },
    { id: 'sales_total', patterns: [/total\s*(sales|revenue)|വിൽപ്പന|വ്യാപാരം|sales\s*(today|this\s*month|this\s*year|this\s*week)/i], priority: 8 },
    { id: 'net_profit', patterns: [/net\s*profit|ലാഭം|നേട്ടം|profit\s*(today|this\s*month|this\s*year)/i], priority: 8 },
    { id: 'marketplace_compare', patterns: [/compare|താരതമ്യം|vs|versus|between.*and/i], priority: 9 },
    { id: 'marketplace_specific', patterns: [/noon|amazon|carrefour|sharaf|trendyol|tradeline|microless/i], priority: 7 },
    { id: 'returns', patterns: [/return|തിരിച്ചുനൽകൽ|റിട്ടേൺ|returned/i], priority: 7 },
    { id: 'pending_settlement', patterns: [/pending|overdue|ബാക്കി|തീരാത്ത|unreconciled|settlement\s*difference/i], priority: 8 },
    { id: 'fees', patterns: [/fee|fees|commission|ഫീസ്/i], priority: 6 },
    { id: 'forecast', patterns: [/forecast|predict|പ്രവചനം|next\s*month|future/i], priority: 9 },
    { id: 'product_analysis', patterns: [/product|ഉൽപ്പന്നം|best\s*selling|worst|top|bottom|margin/i], priority: 6 },
    { id: 'monthly_comparison', patterns: [/compare.*month|last\s*month|previous\s*month|മാസം\s*താരതമ്യം/i], priority: 8 },
    { id: 'help', patterns: [/help|what\s*can\s*you|സഹായം/i], priority: 5 },
  ],
  
  // Malayalam/English date range extraction
  extractDateRange(text) {
    const lower = text.toLowerCase();
    const now = new Date();
    const todayStr = today();
    
    // Today / ഇന്ന്
    if (/today|ഇന്ന്/.test(lower)) {
      return { from: todayStr, to: todayStr, label: 'Today' };
    }
    
    // This week
    if (/this\s*week|\s*ആഴ്ച/.test(lower)) {
      const week = getWeekRange(now);
      return { from: week.start, to: week.end, label: 'This Week' };
    }
    
    // This month / ഈ മാസം
    if (/this\s*month|\s*മാസം/.test(lower)) {
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      return { from: `${y}-${String(m).padStart(2,'0')}-01`, to: todayStr, label: 'This Month' };
    }
    
    // Last month / കഴിഞ്ഞ മാസം
    if (/last\s*month|കഴിഞ്ഞ\s*മാസം|previous\s*month/.test(lower)) {
      const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
      return { 
        from: lastMonth.toISOString().slice(0,10), 
        to: lastMonthEnd.toISOString().slice(0,10),
        label: 'Last Month'
      };
    }
    
    // This year / ഈ വർഷം
    if (/this\s*year|ഈ\s*വർഷം/.test(lower)) {
      return { from: `${now.getFullYear()}-01-01`, to: todayStr, label: 'This Year' };
    }
    
    // Last year
    if (/last\s*year|കഴിഞ്ഞ\s*വർഷം/.test(lower)) {
      const ly = now.getFullYear() - 1;
      return { from: `${ly}-01-01`, to: `${ly}-12-31`, label: 'Last Year' };
    }
    
    // Default: this month
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    return { from: `${y}-${String(m).padStart(2,'0')}-01`, to: todayStr, label: 'This Month (default)' };
  },
  
  extractMarketplace(text) {
    const lower = text.toLowerCase();
    for (const mkt of State.mkt) {
      if (lower.includes(mkt.name.toLowerCase())) return mkt;
    }
    return null;
  },
  
  detectIntent(text) {
    const scores = this.intents.map(intent => {
      let score = 0;
      for (const pattern of intent.patterns) {
        if (pattern.test(text)) score += intent.priority;
      }
      return { ...intent, score };
    });
    scores.sort((a, b) => b.score - a.score);
    return scores[0]?.score > 0 ? scores[0] : null;
  },
  
  async answer(question) {
    const intent = this.detectIntent(question);
    const dateRange = this.extractDateRange(question);
    const marketplace = this.extractMarketplace(question);
    
    // Add user message to conversation
    this.conversation.push({ role: 'user', text: question, ts: Date.now() });
    if (this.conversation.length > this.maxHistory) this.conversation.shift();
    
    let response;
    try {
      if (!intent) {
        response = this.handleUnknown(question);
      } else {
        switch (intent.id) {
          case 'daily_summary': response = this.handleDailySummary(dateRange, marketplace); break;
          case 'sales_total': response = this.handleSalesTotal(dateRange, marketplace); break;
          case 'net_profit': response = this.handleNetProfit(dateRange, marketplace); break;
          case 'marketplace_compare': response = this.handleMarketplaceCompare(dateRange, question); break;
          case 'marketplace_specific': response = this.handleMarketplaceSpecific(dateRange, marketplace); break;
          case 'returns': response = this.handleReturns(dateRange, marketplace); break;
          case 'pending_settlement': response = this.handlePendingSettlement(marketplace); break;
          case 'fees': response = this.handleFees(dateRange, marketplace); break;
          case 'forecast': response = this.handleForecast(marketplace); break;
          case 'product_analysis': response = this.handleProductAnalysis(dateRange, marketplace); break;
          case 'monthly_comparison': response = this.handleMonthlyComparison(marketplace); break;
          case 'help': response = this.handleHelp(); break;
          default: response = this.handleUnknown(question);
        }
      }
    } catch (err) {
      response = { type: 'error', text: `Error processing your question: ${err.message}` };
    }
    
    this.conversation.push({ role: 'assistant', response, ts: Date.now() });
    return response;
  },
  
  handleDailySummary(dateRange, marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    const returns = marketplace
      ? State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id))
      : State.returns;
    
    const todayStr = today();
    const todaySales = sales.filter(s => s.saleDate === todayStr);
    const todayReturns = returns.filter(r => r.returnDate === todayStr);
    const todayAgg = aggregateWithReturns(todaySales, todayReturns);
    
    const monthSales = sales.filter(s => { const d = parseDate(s.saleDate); const now = new Date(); return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const monthReturns = returns.filter(r => { const d = parseDate(r.returnDate); const now = new Date(); return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const monthAgg = aggregateWithReturns(monthSales, monthReturns);
    
    const pendingSettlements = State.sett.filter(s => s.status !== 'Settled');
    const pendingAmount = pendingSettlements.reduce((a, s) => a + Math.max(0, num(s.expected) - num(s.actual)), 0);
    
    return {
      type: 'daily_summary',
      title: `📊 Daily Business Summary${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `Today: ${todayStr}`,
      metrics: [
        { label: "Today's Gross Sales", value: fmt(todayAgg.gross), type: 'verified' },
        { label: "Today's Returns", value: fmt(todayAgg.totalReturns), type: 'verified' },
        { label: "Today's Net Sales", value: fmt(todayAgg.netSales), type: 'calculated' },
        { label: "Today's Net Profit", value: fmt(todayAgg.netProfit), type: 'calculated' },
        { label: "Today's Orders", value: todayAgg.orders, type: 'verified' },
        { label: "Month-to-Date Sales", value: fmt(monthAgg.netSales), type: 'calculated' },
        { label: "Pending Settlements", value: fmt(pendingAmount), type: 'verified' },
      ],
      interpretation: todayAgg.netProfit >= 0 
        ? `Positive day with ${fmt(todayAgg.netProfit)} net profit.` 
        : `Loss-making day with ${fmt(Math.abs(todayAgg.netProfit))} net loss.`,
      sourceAction: { view: 'dashboard', filters: { from: todayStr, to: todayStr, mkt: marketplace?.id || '' } }
    };
  },
  
  handleSalesTotal(dateRange, marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    const returns = marketplace
      ? State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id))
      : State.returns;
    
    const filtered = sales.filter(s => {
      const d = parseDate(s.saleDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    const filteredReturns = returns.filter(r => {
      const d = parseDate(r.returnDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    const agg = aggregateWithReturns(filtered, filteredReturns);
    
    return {
      type: 'sales_total',
      title: ` Sales Summary${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Gross Sales', value: fmt(agg.gross), type: 'verified' },
        { label: 'Sales Returns', value: fmt(agg.totalReturns), type: 'verified' },
        { label: 'Net Sales', value: fmt(agg.netSales), type: 'calculated' },
        { label: 'Total Orders', value: agg.orders, type: 'verified' },
        { label: 'Quantity Sold', value: agg.qty, type: 'verified' },
      ],
      interpretation: `Net sales of ${fmt(agg.netSales)} from ${agg.orders} orders in ${dateRange.label.toLowerCase()}.`,
      sourceAction: { view: 'all', filters: { from: dateRange.from, to: dateRange.to, mkt: marketplace?.id || '' } }
    };
  },
  
  handleNetProfit(dateRange, marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    const returns = marketplace
      ? State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id))
      : State.returns;
    
    const filtered = sales.filter(s => {
      const d = parseDate(s.saleDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    const filteredReturns = returns.filter(r => {
      const d = parseDate(r.returnDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    const agg = aggregateWithReturns(filtered, filteredReturns);
    
    return {
      type: 'net_profit',
      title: `📈 Net Profit Analysis${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Gross Profit (before fees)', value: fmt(agg.profit), type: 'calculated' },
        { label: 'Return Service Fees', value: fmt(agg.totalServiceFees), type: 'verified' },
        { label: 'Other Return Charges', value: fmt(agg.totalOtherCharges), type: 'verified' },
        { label: 'Net Profit', value: fmt(agg.netProfit), type: 'calculated' },
        { label: 'Profit Margin', value: agg.margin.toFixed(2) + '%', type: 'calculated' },
      ],
      interpretation: agg.netProfit >= 0 
        ? `Profitable period with ${agg.margin.toFixed(1)}% margin.` 
        : `Loss-making period. Review costs and returns.`,
      sourceAction: { view: 'dashboard', filters: { from: dateRange.from, to: dateRange.to, mkt: marketplace?.id || '' } }
    };
  },
  
  handleMarketplaceCompare(dateRange, question) {
    // Extract two marketplaces from question
    const mentioned = [];
    for (const mkt of State.mkt) {
      if (question.toLowerCase().includes(mkt.name.toLowerCase())) {
        mentioned.push(mkt);
      }
    }
    
    if (mentioned.length < 2) {
      return {
        type: 'clarification',
        text: `I can compare marketplaces for you. Which two would you like to compare? Available: ${State.mkt.map(m => m.name).join(', ')}.`,
        suggestions: State.mkt.slice(0, 4).map(m => `Compare ${m.name} with others`)
      };
    }
    
    const comparisons = mentioned.map(mkt => {
      const sales = State.sales.filter(s => String(s.mktId) === String(mkt.id));
      const returns = State.returns.filter(r => String(r.marketplaceId) === String(mkt.id));
      const filtered = sales.filter(s => {
        const d = parseDate(s.saleDate);
        if (!d) return false;
        if (dateRange.from && fmtDate(d) < dateRange.from) return false;
        if (dateRange.to && fmtDate(d) > dateRange.to) return false;
        return true;
      });
      const filteredReturns = returns.filter(r => {
        const d = parseDate(r.returnDate);
        if (!d) return false;
        if (dateRange.from && fmtDate(d) < dateRange.from) return false;
        if (dateRange.to && fmtDate(d) > dateRange.to) return false;
        return true;
      });
      return { mkt, agg: aggregateWithReturns(filtered, filteredReturns) };
    });
    
    const tableData = comparisons.map(c => ({
      Marketplace: c.mkt.name,
      'Gross Sales': fmt(c.agg.gross),
      'Returns': fmt(c.agg.totalReturns),
      'Net Sales': fmt(c.agg.netSales),
      'Net Profit': fmt(c.agg.netProfit),
      'Margin': c.agg.margin.toFixed(1) + '%'
    }));
    
    const winner = comparisons.reduce((a, b) => a.agg.netProfit > b.agg.netProfit ? a : b);
    
    return {
      type: 'comparison',
      title: `⚖️ Marketplace Comparison — ${dateRange.label}`,
      dateRange: `${dateRange.from} to ${dateRange.to}`,
      table: tableData,
      interpretation: `${winner.mkt.name} leads with ${fmt(winner.agg.netProfit)} net profit.`,
      sourceAction: { view: 'mktperf', filters: { from: dateRange.from, to: dateRange.to } }
    };
  },
  
  handleMarketplaceSpecific(dateRange, marketplace) {
    if (!marketplace) {
      return {
        type: 'clarification',
        text: `Which marketplace are you asking about? Available: ${State.mkt.map(m => m.name).join(', ')}.`,
        suggestions: State.mkt.slice(0, 4).map(m => `Show ${m.name} performance`)
      };
    }
    
    const sales = State.sales.filter(s => String(s.mktId) === String(marketplace.id));
    const returns = State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id));
    const settlements = State.sett.filter(s => String(s.mktId) === String(marketplace.id));
    
    const filtered = sales.filter(s => {
      const d = parseDate(s.saleDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    const filteredReturns = returns.filter(r => {
      const d = parseDate(r.returnDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    const agg = aggregateWithReturns(filtered, filteredReturns);
    const expectedPayout = settlements.reduce((a, s) => a + num(s.expected), 0);
    const actualPayout = settlements.reduce((a, s) => a + num(s.actual), 0);
    const pending = Math.max(0, expectedPayout - actualPayout);
    
    return {
      type: 'marketplace_detail',
      title: `🏬 ${marketplace.name} — Performance Summary`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Gross Sales', value: fmt(agg.gross), type: 'verified' },
        { label: 'Returns', value: fmt(agg.totalReturns), type: 'verified' },
        { label: 'Net Sales', value: fmt(agg.netSales), type: 'calculated' },
        { label: 'Marketplace Fees', value: fmt(agg.fees), type: 'verified' },
        { label: 'Net Profit', value: fmt(agg.netProfit), type: 'calculated' },
        { label: 'Expected Payout', value: fmt(expectedPayout), type: 'verified' },
        { label: 'Actual Received', value: fmt(actualPayout), type: 'verified' },
        { label: 'Pending Payout', value: fmt(pending), type: 'calculated' },
      ],
      interpretation: `${marketplace.name} generated ${fmt(agg.netProfit)} net profit with ${agg.orders} orders.`,
      sourceAction: { view: 'mktperf', filters: { from: dateRange.from, to: dateRange.to, focus: marketplace.id } }
    };
  },
  
  handleReturns(dateRange, marketplace) {
    const returns = marketplace
      ? State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id))
      : State.returns;
    
    const filtered = returns.filter(r => {
      const d = parseDate(r.returnDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    const totalAmount = filtered.reduce((a, r) => a + num(r.totalReturnedAmount), 0);
    const totalFees = filtered.reduce((a, r) => a + num(r.serviceFee), 0);
    const byStatus = {};
    filtered.forEach(r => { byStatus[r.status] = (byStatus[r.status] || 0) + 1; });
    
    const tableData = filtered.slice(0, 10).map(r => {
      const m = State.mkt.find(x => x.id == r.marketplaceId);
      return {
        Date: fmtDate(r.returnDate),
        Marketplace: m?.name || '-',
        Product: r.productName || '-',
        Qty: r.qtyReturned,
        Amount: fmt(r.totalReturnedAmount),
        Status: r.status
      };
    });
    
    return {
      type: 'returns_summary',
      title: `️ Returns Analysis${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Total Returns', value: filtered.length, type: 'verified' },
        { label: 'Total Returned Amount', value: fmt(totalAmount), type: 'verified' },
        { label: 'Service Fees', value: fmt(totalFees), type: 'verified' },
      ],
      statusBreakdown: byStatus,
      table: tableData.length ? tableData : null,
      interpretation: `${filtered.length} returns totaling ${fmt(totalAmount)} in ${dateRange.label.toLowerCase()}.`,
      sourceAction: { view: 'returns', filters: {} }
    };
  },
  
  handlePendingSettlement(marketplace) {
    const settlements = marketplace
      ? State.sett.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sett;
    
    const pending = settlements.filter(s => s.status !== 'Settled');
    const totalExpected = pending.reduce((a, s) => a + num(s.expected), 0);
    const totalActual = pending.reduce((a, s) => a + num(s.actual), 0);
    const totalDiff = totalExpected - totalActual;
    
    const tableData = pending.map(s => {
      const m = State.mkt.find(x => x.id == s.mktId);
      return {
        Date: fmtDate(s.withdrawalDate),
        Marketplace: m?.name || '-',
        Reference: s.ref || '-',
        Expected: fmt(s.expected),
        Actual: fmt(s.actual),
        Difference: fmt(num(s.actual) - num(s.expected)),
        Status: s.status
      };
    });
    
    return {
      type: 'pending_settlement',
      title: '💰 Pending Settlements',
      metrics: [
        { label: 'Pending Transactions', value: pending.length, type: 'verified' },
        { label: 'Total Expected', value: fmt(totalExpected), type: 'verified' },
        { label: 'Total Received', value: fmt(totalActual), type: 'verified' },
        { label: 'Outstanding Balance', value: fmt(totalDiff), type: 'calculated' },
      ],
      table: tableData.length ? tableData : null,
      interpretation: totalDiff > 0 
        ? `${fmt(totalDiff)} in settlements still pending.` 
        : 'All settlements are reconciled.',
      sourceAction: { view: 'sett', filters: {} }
    };
  },
  
  handleFees(dateRange, marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    
    const filtered = sales.filter(s => {
      const d = parseDate(s.saleDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    const totalReferral = filtered.reduce((a, s) => a + num(s.refFee), 0);
    const totalShipping = filtered.reduce((a, s) => a + num(s.shipFee), 0);
    const totalOutbound = filtered.reduce((a, s) => a + num(s.outFee), 0);
    const totalOther = filtered.reduce((a, s) => a + num(s.othFee), 0);
    const totalFees = totalReferral + totalShipping + totalOutbound + totalOther;
    const grossSales = filtered.reduce((a, s) => a + num(s.gross), 0);
    const feeRatio = grossSales > 0 ? (totalFees / grossSales) * 100 : 0;
    
    return {
      type: 'fees_analysis',
      title: `💳 Fee Analysis${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Referral Fees', value: fmt(totalReferral), type: 'verified' },
        { label: 'Shipping Fees', value: fmt(totalShipping), type: 'verified' },
        { label: 'Outbound Fees', value: fmt(totalOutbound), type: 'verified' },
        { label: 'Other Fees', value: fmt(totalOther), type: 'verified' },
        { label: 'Total Fees', value: fmt(totalFees), type: 'calculated' },
        { label: 'Fee Ratio', value: feeRatio.toFixed(2) + '%', type: 'calculated' },
      ],
      interpretation: `Fees represent ${feeRatio.toFixed(1)}% of gross sales (${fmt(grossSales)}).`,
      sourceAction: { view: 'all', filters: { from: dateRange.from, to: dateRange.to, mkt: marketplace?.id || '' } }
    };
  },
  
  handleForecast(marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    
    // Group by month
    const monthly = {};
    sales.forEach(s => {
      const k = monthKey(s.saleDate);
      if (!k) return;
      monthly[k] = (monthly[k] || 0) + num(s.gross) * revenueTreatment(s.orderStatus);
    });
    
    const months = Object.keys(monthly).sort();
    if (months.length < 3) {
      return {
        type: 'forecast',
        title: '📉 Sales Forecast',
        warning: 'Insufficient data. Need at least 3 months of history for reliable forecasting.',
        metrics: [{ label: 'Months of Data', value: months.length, type: 'verified' }],
        interpretation: 'Please add more sales data to enable forecasting.'
      };
    }
    
    // Simple linear regression
    const values = months.map(m => monthly[m]);
    const n = values.length;
    const sumX = (n * (n - 1)) / 2;
    const sumY = values.reduce((a, b) => a + b, 0);
    const sumXY = values.reduce((a, v, i) => a + i * v, 0);
    const sumX2 = (n * (n - 1) * (2 * n - 1)) / 6;
    const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
    const intercept = (sumY - slope * sumX) / n;
    
    // Next month forecast
    const nextValue = slope * n + intercept;
    const avg = sumY / n;
    const stdDev = Math.sqrt(values.reduce((a, v) => a + Math.pow(v - avg, 2), 0) / n);
    const lower = Math.max(0, nextValue - 1.96 * stdDev);
    const upper = nextValue + 1.96 * stdDev;
    const confidence = Math.max(50, 100 - (stdDev / avg) * 100);
    
    const trend = slope > 0 ? 'upward' : slope < 0 ? 'downward' : 'flat';
    const trendPct = avg > 0 ? (slope / avg) * 100 : 0;
    
    return {
      type: 'forecast',
      title: `📈 Sales Forecast${marketplace ? ` — ${marketplace.name}` : ''}`,
      metrics: [
        { label: 'Next Month Forecast', value: fmt(nextValue), type: 'calculated' },
        { label: 'Confidence Range', value: `${fmt(lower)} — ${fmt(upper)}`, type: 'calculated' },
        { label: 'Confidence Level', value: confidence.toFixed(0) + '%', type: 'calculated' },
        { label: 'Trend', value: `${trend} (${trendPct.toFixed(1)}%/month)`, type: 'calculated' },
        { label: 'Data Period', value: `${months[0]} to ${months[months.length-1]}`, type: 'verified' },
        { label: 'Months Analyzed', value: n, type: 'verified' },
      ],
      chart: { labels: [...months, 'Next'], values: [...values, nextValue] },
      interpretation: `Based on ${n} months of data, sales show a ${trend} trend. Next month forecast: ${fmt(nextValue)} (±${fmt(stdDev * 1.96)}).`,
      warning: 'This is a statistical estimate, not a guarantee. Actual results may vary.',
      sourceAction: { view: 'monthly', filters: {} }
    };
  },
  
  handleProductAnalysis(dateRange, marketplace) {
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    
    const filtered = sales.filter(s => {
      const d = parseDate(s.saleDate);
      if (!d) return false;
      if (dateRange.from && fmtDate(d) < dateRange.from) return false;
      if (dateRange.to && fmtDate(d) > dateRange.to) return false;
      return true;
    });
    
    // Group by product
    const byProduct = {};
    filtered.forEach(s => {
      const key = (s.sku || s.product || 'Unknown').toLowerCase();
      if (!byProduct[key]) byProduct[key] = { name: s.product, sku: s.sku, qty: 0, gross: 0, profit: 0, orders: 0 };
      byProduct[key].qty += num(s.qty);
      byProduct[key].gross += num(s.gross);
      byProduct[key].profit += num(s.profit);
      byProduct[key].orders++;
    });
    
    const products = Object.values(byProduct);
    const topProfit = [...products].sort((a, b) => b.profit - a.profit).slice(0, 5);
    const topSales = [...products].sort((a, b) => b.gross - a.gross).slice(0, 5);
    const negative = products.filter(p => p.profit < 0).sort((a, b) => a.profit - b.profit).slice(0, 5);
    
    const tableData = topProfit.map(p => ({
      Product: p.name || p.sku || 'Unknown',
      Orders: p.orders,
      Qty: p.qty,
      Sales: fmt(p.gross),
      Profit: fmt(p.profit)
    }));
    
    return {
      type: 'product_analysis',
      title: `📦 Product Analysis${marketplace ? ` — ${marketplace.name}` : ''}`,
      dateRange: `${dateRange.label}: ${dateRange.from} to ${dateRange.to}`,
      metrics: [
        { label: 'Unique Products', value: products.length, type: 'verified' },
        { label: 'Profitable Products', value: products.filter(p => p.profit > 0).length, type: 'calculated' },
        { label: 'Loss-making Products', value: negative.length, type: 'calculated' },
      ],
      topByProfit: topProfit,
      topBySales: topSales,
      negative: negative,
      table: tableData,
      interpretation: negative.length > 0 
        ? `⚠️ ${negative.length} products are generating losses. Review pricing and costs.` 
        : 'All products are profitable in this period.',
      sourceAction: { view: 'products', filters: {} }
    };
  },
  
  handleMonthlyComparison(marketplace) {
    const now = new Date();
    const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastMonthKey = lastMonth.toISOString().slice(0, 7);
    
    const sales = marketplace 
      ? State.sales.filter(s => String(s.mktId) === String(marketplace.id))
      : State.sales;
    const returns = marketplace
      ? State.returns.filter(r => String(r.marketplaceId) === String(marketplace.id))
      : State.returns;
    
    const thisMonthSales = sales.filter(s => monthKey(s.saleDate) === thisMonth);
    const lastMonthSales = sales.filter(s => monthKey(s.saleDate) === lastMonthKey);
    const thisMonthReturns = returns.filter(r => monthKey(r.returnDate) === thisMonth);
    const lastMonthReturns = returns.filter(r => monthKey(r.returnDate) === lastMonthKey);
    
    const thisAgg = aggregateWithReturns(thisMonthSales, thisMonthReturns);
    const lastAgg = aggregateWithReturns(lastMonthSales, lastMonthReturns);
    
    const salesChange = lastAgg.netSales > 0 ? ((thisAgg.netSales - lastAgg.netSales) / lastAgg.netSales) * 100 : 0;
    const profitChange = lastAgg.netProfit !== 0 ? ((thisAgg.netProfit - lastAgg.netProfit) / Math.abs(lastAgg.netProfit)) * 100 : 0;
    
    return {
      type: 'monthly_comparison',
      title: `📊 Month-over-Month Comparison${marketplace ? ` — ${marketplace.name}` : ''}`,
      metrics: [
        { label: 'This Month Sales', value: fmt(thisAgg.netSales), change: salesChange, type: 'calculated' },
        { label: 'Last Month Sales', value: fmt(lastAgg.netSales), type: 'verified' },
        { label: 'This Month Profit', value: fmt(thisAgg.netProfit), change: profitChange, type: 'calculated' },
        { label: 'Last Month Profit', value: fmt(lastAgg.netProfit), type: 'verified' },
        { label: 'This Month Orders', value: thisAgg.orders, type: 'verified' },
        { label: 'Last Month Orders', value: lastAgg.orders, type: 'verified' },
      ],
      interpretation: salesChange > 0 
        ? `Sales up ${salesChange.toFixed(1)}% vs last month.` 
        : salesChange < 0 ? `Sales down ${Math.abs(salesChange).toFixed(1)}% vs last month.` : 'Sales flat vs last month.',
      sourceAction: { view: 'monthly', filters: {} }
    };
  },
  
  handleHelp() {
    return {
      type: 'help',
      title: '🤖 AI Assistant — Help',
      text: `I can help you analyze your business data. Try asking:`,
      suggestions: [
        'What are my total sales today?',
        'What is my net profit this month?',
        'Compare Amazon and Noon',
        'Show pending settlements',
        'Which products have highest profit?',
        'Forecast next month sales',
        'Show returns this month',
        'Summarize today\'s business'
      ],
      note: 'I can understand both English and Malayalam (മലയാളം). All answers use your actual business data.'
    };
  },
  
  handleUnknown(question) {
    return {
      type: 'unknown',
      text: `I'm not sure how to answer "${question}". Try asking about sales, profit, marketplaces, returns, settlements, or forecasts.`,
      suggestions: [
        'What are my sales today?',
        'Show marketplace comparison',
        'What is my net profit?',
        'Help'
      ]
    };
  }
};
