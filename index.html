<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E Smart Electronics — Sales Management</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
<style>
:root, [data-theme="light"] {
  --bg:#F0F2F5; --bg-secondary:#E9EDF2; --panel:#F8F9FB; --panel2:#FFFFFF;
  --text:#202733; --muted:#5F6875;
  --border:#D9DEE6; --primary:#202733; --primary-text:#FFFFFF; --primary-hover:#3a4252;
  --secondary:#FFFFFF; --secondary-text:#202733;
  --success:#059669; --danger:#dc2626; --warn:#d97706; --info:#2563eb;
  --input-bg:#FFFFFF; --hover:#E9EDF2;
  --sidebar-bg:#FFFFFF; --sidebar-text:#3a4252; --sidebar-active:#E9EDF2;
  --shadow:0 1px 3px rgba(32,39,51,.08);
  --chart-grid:rgba(32,39,51,.08); --chart-text:#5F6875;
  --table-header:#E9EDF2; --table-stripe:#F8F9FB; --scrollbar:#C5CBD4;
  --link:#2563eb; --glass-bg:rgba(248,249,251,.7); --glass-border:rgba(32,39,51,.1);
  --blur:none;
}
[data-theme="dark"] {
  --bg:#0a0a0b; --bg-secondary:#111113; --panel:#141416; --panel2:#1c1c1f;
  --text:#f5f5f5; --muted:#a1a1aa;
  --border:#27272a; --primary:#f5f5f5; --primary-text:#0a0a0b; --primary-hover:#e4e4e7;
  --secondary:#1c1c1f; --secondary-text:#f5f5f5;
  --success:#4ade80; --danger:#f87171; --warn:#fbbf24; --info:#60a5fa;
  --input-bg:#0f0f12; --hover:#27272a;
  --sidebar-bg:#0f0f12; --sidebar-text:#d4d4d8; --sidebar-active:rgba(255,255,255,.06);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --chart-grid:rgba(255,255,255,.06); --chart-text:#a1a1aa;
  --table-header:#1c1c1f; --table-stripe:rgba(255,255,255,.02); --scrollbar:#3f3f46;
  --link:#60a5fa; --glass-bg:rgba(20,20,22,.7); --glass-border:rgba(255,255,255,.1);
  --blur:none;
}
[data-theme="emerald"] {
  --bg:#f0f7f4; --bg-secondary:#e6f2ed; --panel:#ffffff; --panel2:#f0fdf4;
  --text:#1e293b; --muted:#64748b;
  --border:#bbf7d0; --primary:#047857; --primary-text:#ffffff; --primary-hover:#065f46;
  --secondary:#ffffff; --secondary-text:#047857;
  --success:#059669; --danger:#dc2626; --warn:#d97706; --info:#0284c7;
  --input-bg:#ffffff; --hover:#ecfdf5;
  --sidebar-bg:#064e3b; --sidebar-text:#d1fae5; --sidebar-active:rgba(255,255,255,.1);
  --shadow:0 1px 3px rgba(4,120,87,.1);
  --chart-grid:rgba(4,120,87,.08); --chart-text:#475569;
  --table-header:#ecfdf5; --table-stripe:#f0fdf4; --scrollbar:#86efac;
  --link:#047857; --glass-bg:rgba(255,255,255,.7); --glass-border:rgba(4,120,87,.2);
  --blur:none;
}
[data-theme="forest"] {
  --bg:#E8FFF2; --bg-secondary:#d4f5e6; --panel:#ffffff; --panel2:#f0fdf4;
  --text:#0a2e1f; --muted:#3d7a5f;
  --border:#a8e0c8; --primary:#075E46; --primary-text:#ffffff; --primary-hover:#054a37;
  --secondary:#ffffff; --secondary-text:#075E46;
  --success:#059669; --danger:#b91c1c; --warn:#92400e; --info:#1d4ed8;
  --input-bg:#ffffff; --hover:#d4f5e6;
  --sidebar-bg:#075E46; --sidebar-text:#E8FFF2; --sidebar-active:rgba(232,255,242,.15);
  --shadow:0 1px 3px rgba(7,94,70,.1);
  --chart-grid:rgba(7,94,70,.08); --chart-text:#3d7a5f;
  --table-header:#d4f5e6; --table-stripe:#E8FFF2; --scrollbar:#6bc4a0;
  --link:#075E46; --glass-bg:rgba(255,255,255,.75); --glass-border:rgba(7,94,70,.25);
  --blur:none;
}
[data-theme="original"] {
  --bg:#060913; --bg-secondary:#0a1020; --panel:#0f1730; --panel2:#0b1228;
  --text:#e5e7eb; --muted:#9ca3af;
  --border:rgba(212,175,55,.22); --primary:#d4af37; --primary-text:#0a1128; --primary-hover:#e6c54b;
  --secondary:rgba(255,255,255,.05); --secondary-text:#e5e7eb;
  --success:#22c55e; --danger:#ef4444; --warn:#f59e0b; --info:#60a5fa;
  --input-bg:#0b1430; --hover:rgba(212,175,55,.08);
  --sidebar-bg:#0a1128; --sidebar-text:#cbd5e1; --sidebar-active:rgba(212,175,55,.15);
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --chart-grid:rgba(255,255,255,.06); --chart-text:#9ca3af;
  --table-header:#0b1430; --table-stripe:rgba(212,175,55,.03); --scrollbar:#1a2550;
  --link:#d4af37; --glass-bg:rgba(15,23,48,.7); --glass-border:rgba(212,175,55,.3);
  --blur:none;
}
[data-theme="glass"] {
  --bg:#e8ecf1; --bg-secondary:#dde3ea; --panel:rgba(255,255,255,.55); --panel2:rgba(255,255,255,.35);
  --text:#1e293b; --muted:#475569;
  --border:rgba(255,255,255,.5); --primary:#475569; --primary-text:#ffffff; --primary-hover:#334155;
  --secondary:rgba(255,255,255,.4); --secondary-text:#1e293b;
  --success:#059669; --danger:#dc2626; --warn:#d97706; --info:#2563eb;
  --input-bg:rgba(255,255,255,.5); --hover:rgba(255,255,255,.6);
  --sidebar-bg:rgba(255,255,255,.3); --sidebar-text:#1e293b; --sidebar-active:rgba(255,255,255,.5);
  --shadow:0 8px 32px rgba(30,41,59,.12);
  --chart-grid:rgba(30,41,59,.08); --chart-text:#475569;
  --table-header:rgba(255,255,255,.4); --table-stripe:rgba(255,255,255,.2); --scrollbar:rgba(71,85,105,.3);
  --link:#2563eb; --glass-bg:rgba(255,255,255,.45); --glass-border:rgba(255,255,255,.6);
  --blur:blur(20px);
}
[data-theme="glass"] body { background:linear-gradient(135deg,#e8ecf1 0%,#dde3ea 50%,#d0d7e0 100%); background-attachment:fixed; min-height:100vh; }
[data-theme="glass"] .card, [data-theme="glass"] .kpi, [data-theme="glass"] .chart-box, [data-theme="glass"] .modal, [data-theme="glass"] .theme-card, [data-theme="glass"] .mkt-card, [data-theme="glass"] .toast, [data-theme="glass"] .ai-message { background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--glass-border); box-shadow:var(--shadow); }
[data-theme="glass"] .sidebar { background:var(--sidebar-bg); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-right:1px solid var(--glass-border); }
[data-theme="glass"] .header { background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-bottom:1px solid var(--glass-border); }
[data-theme="glass"] .btn-primary { background:var(--primary); color:var(--primary-text); }
[data-theme="glass"] .input, [data-theme="glass"] select, [data-theme="glass"] textarea { background:var(--input-bg); color:var(--text); border:1px solid var(--glass-border); backdrop-filter:blur(10px); }
[data-theme="glass"] table.data th { background:var(--table-header); color:var(--text); backdrop-filter:blur(10px); }
[data-theme="glass"] .login-card { background:var(--panel); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border:1px solid var(--glass-border); }

:root { --user-accent: var(--primary); --user-bg: var(--bg); --user-card: var(--panel); }

* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--user-bg, var(--bg)); color:var(--text); font-family:Inter,system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.5; transition:background .3s, color .3s; }
body { min-height:100vh; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg-secondary, var(--bg)); }
::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:4px; }

.hide { display:none !important; }
.muted { color:var(--muted); }
.success { color:var(--success); }
.danger { color:var(--danger); }
.warn { color:var(--warn); }
.nowrap { white-space:nowrap; }
a, .link { color:var(--link); cursor:pointer; text-decoration:underline; }

.app { display:flex; min-height:100vh; }
.sidebar { width:240px; min-height:100vh; background:var(--sidebar-bg); border-right:1px solid var(--border); position:fixed; inset:0 auto 0 0; display:flex; flex-direction:column; z-index:50; transition:transform .25s, background .3s; }
.main { flex:1; margin-left:240px; min-width:0; }
.header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:30; box-shadow:var(--shadow); transition:background .3s; }
.content { padding:16px 20px; max-width:1600px; margin:0 auto; }

.brand { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.brand-mark { width:38px; height:38px; border-radius:9px; background:var(--user-accent, var(--primary)); color:var(--primary-text); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
.brand-name { font-weight:800; font-size:14px; color:var(--text); }
.brand-sub { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }

.nav { padding:8px; overflow-y:auto; flex:1; }
.nav-item { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:7px; cursor:pointer; color:var(--sidebar-text); font-weight:600; margin-bottom:1px; border:none; background:transparent; width:100%; text-align:left; font-size:13px; transition:background .15s, color .15s; }
.nav-item:hover { background:var(--sidebar-active); color:var(--text); }
.nav-item.active { background:var(--sidebar-active); color:var(--user-accent, var(--primary)); border-left:3px solid var(--user-accent, var(--primary)); padding-left:8px; }
.sidebar-footer { padding:10px 12px; border-top:1px solid var(--border); }

.card { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); transition:background .3s, border-color .3s; }
.card h2, .card h3 { margin:0 0 10px 0; font-size:14px; font-weight:800; color:var(--user-accent, var(--primary)); }
.card h2 { font-size:16px; }

.btn { display:inline-flex; align-items:center; gap:5px; padding:7px 13px; border-radius:7px; border:1px solid var(--border); background:var(--secondary); color:var(--secondary-text); font-weight:700; cursor:pointer; font-size:12px; transition:background .15s, opacity .15s; text-decoration:none; position:relative; }
.btn:hover { opacity:.88; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-primary { background:var(--user-accent, var(--primary)); color:var(--primary-text); border-color:var(--user-accent, var(--primary)); }
.btn-primary:hover { background:var(--primary-hover); }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-success { background:var(--success); color:#fff; border-color:var(--success); }
.btn-sm { padding:4px 8px; font-size:11px; }

.btn.loading { pointer-events:none; color:transparent; }
.btn.loading::after { content:""; position:absolute; width:14px; height:14px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .6s linear infinite; left:50%; top:50%; margin:-7px 0 0 -7px; }
@keyframes spin { to { transform:rotate(360deg); } }

.input, select, textarea { width:100%; padding:7px 10px; background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:6px; font:inherit; font-size:13px; transition:border-color .15s, background .3s; }
.input:focus, select:focus, textarea:focus { outline:none; border-color:var(--user-accent, var(--primary)); box-shadow:0 0 0 2px color-mix(in srgb, var(--user-accent, var(--primary)) 18%, transparent); }
textarea { min-height:60px; resize:vertical; }
label { display:block; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }

.grid { display:grid; gap:10px; }
.grid-2 { grid-template-columns:1fr; }
.grid-3 { grid-template-columns:1fr; }
.grid-4 { grid-template-columns:repeat(2,1fr); }
.grid-5 { grid-template-columns:repeat(2,1fr); }
@media(min-width:768px) { .grid-2 { grid-template-columns:1fr 1fr; } .grid-3 { grid-template-columns:repeat(3,1fr); } .grid-4 { grid-template-columns:repeat(4,1fr); } .grid-5 { grid-template-columns:repeat(5,1fr); } }

.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:8px; margin-bottom:12px; }
.kpi { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:9px; padding:10px 12px; box-shadow:var(--shadow); transition:background .3s; }
.kpi-label { font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:800; letter-spacing:.04em; }
.kpi-value { font-size:18px; font-weight:800; margin-top:2px; }

.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:7px; }
table.data { width:100%; border-collapse:collapse; background:var(--panel); font-size:12px; min-width:680px; }
table.data th, table.data td { padding:7px 9px; text-align:left; border-bottom:1px solid var(--border); color:var(--text); }
table.data th { background:var(--table-header); color:var(--user-accent, var(--primary)); font-size:10px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; font-weight:800; }
table.data tbody tr:nth-child(even) { background:var(--table-stripe); }
table.data tbody tr:hover { background:var(--hover); }

.pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; background:var(--panel2); color:var(--muted); border:1px solid var(--border); }
.pill.success { color:var(--success); border-color:color-mix(in srgb, var(--success) 40%, var(--border)); background:color-mix(in srgb, var(--success) 8%, var(--panel)); }
.pill.danger { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--border)); background:color-mix(in srgb, var(--danger) 8%, var(--panel)); }
.pill.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, var(--border)); background:color-mix(in srgb, var(--warn) 8%, var(--panel)); }
.pill.info { color:var(--info); border-color:color-mix(in srgb, var(--info) 40%, var(--border)); background:color-mix(in srgb, var(--info) 8%, var(--panel)); }

.chart-box { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:10px; padding:10px 12px; box-shadow:var(--shadow); }
.chart-title { font-size:12px; font-weight:800; color:var(--user-accent, var(--primary)); margin-bottom:4px; }
.chart-container { position:relative; height:220px; }
@media(min-width:1024px) { .chart-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } }
@media(max-width:768px) { .chart-container { height:180px; } }

.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:12px; z-index:100; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; max-width:900px; width:100%; max-height:90vh; overflow:auto; padding:18px; box-shadow:0 8px 30px rgba(0,0,0,.3); color:var(--text); }

.toast-root { position:fixed; bottom:14px; right:14px; z-index:200; display:flex; flex-direction:column; gap:6px; }
.toast { background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--user-accent, var(--primary)); padding:9px 13px; border-radius:7px; font-weight:600; font-size:13px; box-shadow:0 4px 12px rgba(0,0,0,.15); animation:slideIn .25s ease; color:var(--text); backdrop-filter:var(--blur,none); }
.toast.success { border-left-color:var(--success); }
.toast.error { border-left-color:var(--danger); }
@keyframes slideIn { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }

.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--user-bg, var(--bg)); }
.login-card { max-width:400px; width:100%; }

.mkt-logo { width:32px; height:32px; border-radius:7px; object-fit:contain; border:1px solid var(--border); background:var(--panel); vertical-align:middle; margin-right:5px; }
.mkt-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 7px; background:var(--panel2); border:1px solid var(--border); border-radius:5px; font-weight:700; font-size:11px; color:var(--text); }

.divider { height:1px; background:var(--border); margin:10px 0; }
.row-actions { display:flex; gap:3px; flex-wrap:wrap; }

.theme-card { border:1px solid var(--border); border-radius:9px; padding:11px; background:var(--panel); transition:outline .15s; }
.theme-card.current { outline:2px solid var(--user-accent, var(--primary)); }
.theme-preview { border-radius:7px; padding:8px; margin:7px 0; border:1px solid; }

.menu-btn { display:none; }
.sidebar-overlay { display:none; }
@media(max-width:1024px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; }
  .menu-btn { display:inline-flex; }
  .sidebar-overlay.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; }
}

.reset-warning { background:color-mix(in srgb, var(--danger) 8%, var(--panel)); border:1px solid color-mix(in srgb, var(--danger) 30%, var(--border)); border-radius:8px; padding:14px; margin-bottom:12px; color:var(--text); }
.mkt-card { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:9px; padding:10px 12px; box-shadow:var(--shadow); border-left:3px solid var(--user-accent, var(--primary)); }
.mkt-card-name { font-weight:800; font-size:13px; margin-bottom:6px; display:flex; align-items:center; gap:6px; color:var(--text); }
.mkt-card-row { display:flex; justify-content:space-between; font-size:11px; padding:2px 0; color:var(--text); }
.mkt-card-row .lbl { color:var(--muted); }
.mkt-card-row .val { font-weight:700; }
.alert { padding:10px 14px; border-radius:7px; margin-bottom:10px; font-size:13px; border:1px solid; color:var(--text); }
.alert-success { background:color-mix(in srgb, var(--success) 10%, var(--panel)); border-color:var(--success); color:var(--success); }
.alert-error { background:color-mix(in srgb, var(--danger) 10%, var(--panel)); border-color:var(--danger); color:var(--danger); }
.alert-info { background:color-mix(in srgb, var(--info) 10%, var(--panel)); border-color:var(--info); color:var(--info); }

.backup-status { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel2); border-radius:7px; margin:8px 0; font-size:12px; color:var(--text); }
.backup-dot { width:8px; height:8px; border-radius:50%; }
.backup-dot.active { background:var(--success); }
.backup-dot.inactive { background:var(--muted); }
.backup-dot.error { background:var(--danger); }
.backup-dot.warning { background:var(--warn); }

.color-picker-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.color-picker-row:last-child { border-bottom:none; }
.color-picker-row label { margin:0; flex:1; font-size:12px; text-transform:none; letter-spacing:0; color:var(--text); }
.color-picker-row input[type="color"] { width:50px; height:36px; padding:2px; cursor:pointer; background:var(--input-bg); border:1px solid var(--border); border-radius:6px; }
.color-picker-row .hex-value { font-family:monospace; font-size:12px; color:var(--muted); min-width:70px; }

/* AI ASSISTANT STYLES */
.ai-container { display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:900px) { .ai-container { grid-template-columns:1fr 320px; } }
.ai-chat { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:10px; padding:16px; min-height:500px; display:flex; flex-direction:column; }
.ai-sidebar { background:var(--user-card, var(--panel)); border:1px solid var(--border); border-radius:10px; padding:16px; }
.ai-messages { flex:1; overflow-y:auto; max-height:600px; padding:10px 0; }
.ai-message { margin-bottom:14px; animation:fadeIn .3s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.ai-message.user { text-align:right; }
.ai-message.user .ai-bubble { background:var(--user-accent, var(--primary)); color:var(--primary-text); margin-left:auto; max-width:80%; }
.ai-message.assistant .ai-bubble { background:var(--panel2); color:var(--text); max-width:85%; border:1px solid var(--border); }
.ai-bubble { padding:10px 14px; border-radius:10px; display:inline-block; text-align:left; font-size:13px; line-height:1.5; }
.ai-bubble p { margin:6px 0; }
.ai-bubble ul, .ai-bubble ol { margin:6px 0; padding-left:20px; }
.ai-bubble li { margin:3px 0; }
.ai-bubble strong { font-weight:700; }
.ai-bubble .verified { color:var(--success); font-weight:700; }
.ai-bubble .calculated { color:var(--info); font-weight:700; }
.ai-bubble .interpretation { color:var(--warn); font-style:italic; }
.ai-bubble table { width:100%; border-collapse:collapse; margin:8px 0; font-size:12px; }
.ai-bubble table th, .ai-bubble table td { padding:5px 8px; border:1px solid var(--border); text-align:left; }

<script>
/* ============================================================
   E SMART ELECTRONICS — AI-POWERED BUSINESS MANAGEMENT
   All existing features preserved. AI added as new module.
   ============================================================ */

const DB_NAME='esmart_db', DB_VERSION=2;
let db=null;
const State={user:null, sales:[], mkt:[], products:[], sett:[], returns:[], users:[], settings:{}, page:'dashboard', filters:{}, saving:false, backupHandle:null, backupIntervalId:null, backupRunning:false, backupRetryCount:0};
const charts={};

const $=id=>document.getElementById(id);
const esc=v=>v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const fmt=v=>{const cur=State.settings.currency||'AED';return `${cur} ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;};

function currentOwnerId(){ return State.user?.id || null; }
function ownedRecords(records){const oid=currentOwnerId();if(!oid)return records;return records.filter(r=>{if(r.ownerId===undefined||r.ownerId===null)return oid===1;return r.ownerId===oid;});}

function parseDate(v){if(!v)return null;if(v instanceof Date)return isNaN(v)?null:v;if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return isNaN(d)?null:d;}const s=String(v).trim();let d=new Date(s);if(!isNaN(d))return d;const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let[_,dd,mm,yy]=m;if(yy.length===2)yy='20'+yy;d=new Date(+yy,+mm-1,+dd);if(!isNaN(d))return d;}return null;}
function fmtDate(v){const d=parseDate(v);return d?d.toISOString().slice(0,10):'';}
function monthKey(v){const d=parseDate(v);return d?d.toISOString().slice(0,7):'';}
function yearKey(v){const d=parseDate(v);return d?d.toISOString().slice(0,4):'';}

function toast(msg,type='info'){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);}
function openModal(html){$('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){$('modal').innerHTML='';}
function btnLoading(btn,loading){if(!btn)return;if(loading){btn.classList.add('loading');btn.dataset.origText=btn.textContent;btn.disabled=true;}else{btn.classList.remove('loading');btn.disabled=false;if(btn.dataset.origText)btn.textContent=btn.dataset.origText;}}

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sales')){const s=d.createObjectStore('sales',{keyPath:'id',autoIncrement:true});s.createIndex('date','saleDate');s.createIndex('mkt','mktId');s.createIndex('owner','ownerId');}if(!d.objectStoreNames.contains('mkt')){const s=d.createObjectStore('mkt',{keyPath:'id',autoIncrement:true});s.createIndex('owner','ownerId');}if(!d.objectStoreNames.contains('products')){const s=d.createObjectStore('products',{keyPath:'id',autoIncrement:true});s.createIndex('sku','sku');s.createIndex('owner','ownerId');}if(!d.objectStoreNames.contains('sett')){const s=d.createObjectStore('sett',{keyPath:'id',autoIncrement:true});s.createIndex('mkt','mktId');s.createIndex('owner','ownerId');}if(!d.objectStoreNames.contains('returns')){const s=d.createObjectStore('returns',{keyPath:'id',autoIncrement:true});s.createIndex('mkt','marketplaceId');s.createIndex('sale','originalSaleId');s.createIndex('date','returnDate');s.createIndex('owner','ownerId');}if(!d.objectStoreNames.contains('users'))d.createObjectStore('users',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});if(!d.objectStoreNames.contains('audit'))d.createObjectStore('audit',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('imports'))d.createObjectStore('imports',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=()=>rej(r.error);});}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const all=s=>new Promise((res,rej)=>{const r=tx(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const put=(s,v)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const add=(s,v)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').add(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const del=(s,k)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const clearStore=s=>new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

async function loadAll(){const allSales=await all('sales');const allMkt=await all('mkt');const allProducts=await all('products');const allSett=await all('sett');const allReturns=await all('returns');State.users=await all('users');const s=await all('settings');State.settings={};s.forEach(x=>State.settings[x.key]=x.value);State.sales=ownedRecords(allSales);State.mkt=ownedRecords(allMkt);State.products=ownedRecords(allProducts);State.sett=ownedRecords(allSett);State.returns=ownedRecords(allReturns);}
async function saveSetting(k,v){State.settings[k]=v;await put('settings',{key:k,value:v});}
async function audit(a,d){try{await add('audit',{ts:Date.now(),u:State.user?.username||'system',a,d:JSON.stringify(d)});}catch(e){}}

async function seed(){const existingUsers=await all('users');const hasAdmin=existingUsers.find(u=>u.username==='admin');if(!hasAdmin){await add('users',{username:'admin',password:'admin123',role:'Administrator',fullName:'Administrator',active:true,createdAt:Date.now()});}const defaults={companyName:'E Smart Electronics LLC',country:'UAE',currency:'AED',theme:'light',feeMode:'pricePerUnit_feesPerLine',costMode:'perUnit',cancelledTreatment:'exclude',returnReportingView:'original',orderStatuses:['Pending','Confirmed','Shipped','Delivered','Cancelled','Returned','Refunded'],paymentStatuses:['Pending','Partially Paid','Paid','Settled','Disputed','On Hold'],settlementStatuses:['Pending','Partially Settled','Settled','Disputed','On Hold'],returnStatuses:['Pending','Confirmed','Processed','Rejected'],importMapping:{'DATE':'saleDate','STORE CODE':'storeCode','Transaction ID':'transactionId','ORDER ID':'orderNumber','ORDER NUMBER':'orderNumber','PRODUCT':'productName','QTY':'qty','SELLING PRICE':'price','COST':'pcost','Commission Fees':'refFee','Commission':'refFee','Shipping Fee':'shipFee','Shipping':'shipFee','Closing Fees':'outFee','Closing Fee':'outFee','W/D BALANCE':'wd','W/D Balance':'wd','Withdrawal Balance':'wd','PROFIT':'profit','STATUS':'orderStatus'},autoBackup:false,backupFrequency:300,lastBackupTime:'Never',lastBackupStatus:'Not configured',backupFolderName:'',themeColors:{},aiProvider:'local',aiApiKey:'',aiEnabled:true};for(const k of Object.keys(defaults)){if(State.settings[k]===undefined)await saveSetting(k,defaults[k]);}}

async function seedMarketplacesForUser(userId){const allMkt=await all('mkt');const userMkt=allMkt.filter(m=>m.ownerId===userId);if(userMkt.length===0){for(const n of ['Noon','Amazon','Carrefour','Sharaf DG','Trendyol','Tradeline','Microless']){await add('mkt',{name:n,code:n.toUpperCase().replace(/\s+/g,''),active:true,currency:'AED',storeName:'',storeCode:'',logoDataUrl:'',brandColor:'#111',notes:'',ownerId:userId,createdAt:Date.now()});}}}

/* ============================================================
   FINANCIAL CALCULATIONS — UNCHANGED
   ============================================================ */
function calcSale(r){const q=Math.max(0,num(r.qty));const price=num(r.price);const feeMode=State.settings.feeMode||'pricePerUnit_feesPerLine';const gross=feeMode==='pricePerUnit_feesPerLine'?price*q:price;const ref=num(r.refFee),ship=num(r.shipFee),out=num(r.outFee),oth=num(r.othFee),ref_amt=num(r.refund);const fees=ref+ship+out+oth;const wd=Math.max(0,gross-fees-ref_amt);const costMode=State.settings.costMode||'perUnit';const pc=num(r.pcost);const tc=costMode==='perUnit'?pc*q:pc;const profit=wd-tc;const margin=gross>0?(profit/gross)*100:0;return{gross:+gross.toFixed(2),refFee:+ref.toFixed(2),shipFee:+ship.toFixed(2),outFee:+out.toFixed(2),othFee:+oth.toFixed(2),refund:+ref_amt.toFixed(2),fees:+fees.toFixed(2),wd:+wd.toFixed(2),tc:+tc.toFixed(2),profit:+profit.toFixed(2),margin:+margin.toFixed(2)};}
function revenueTreatment(orderStatus){const t=State.settings.cancelledTreatment||'exclude';if(['Cancelled','Returned','Refunded'].includes(orderStatus)&&t==='exclude')return 0;return 1;}

function aggregateWithReturns(sales,returns,filterFn){
  let gross=0,fees=0,wd=0,cost=0,profit=0,qty=0,ref=0,ship=0,out=0,oth=0,cancelled=0,returned=0;
  let totalReturns=0,totalServiceFees=0,totalOtherCharges=0;
  const filteredSales=filterFn?sales.filter(filterFn):sales;
  const filteredReturns=filterFn?returns.filter(filterFn):returns;
  const returnedBySale={};
  filteredReturns.forEach(r=>{if(r.originalSaleId){returnedBySale[r.originalSaleId]=(returnedBySale[r.originalSaleId]||0)+num(r.qtyReturned);}});
  filteredSales.forEach(r=>{const t=revenueTreatment(r.orderStatus);const returnedQty=returnedBySale[r.id]||0;const originalQty=num(r.qty);const effectiveQty=Math.max(0,originalQty-returnedQty);const ratio=originalQty>0?effectiveQty/originalQty:0;qty+=effectiveQty;if(r.orderStatus==='Cancelled')cancelled++;if(['Returned','Refunded'].includes(r.orderStatus))returned++;gross+=num(r.gross)*ratio*t;fees+=num(r.fees)*ratio;ref+=num(r.refFee)*ratio;ship+=num(r.shipFee)*ratio;out+=num(r.outFee)*ratio;oth+=num(r.othFee)*ratio;wd+=num(r.wd)*ratio*t;cost+=num(r.tc)*ratio;profit+=num(r.profit)*ratio*t;});
  filteredReturns.forEach(r=>{totalReturns+=num(r.totalReturnedAmount);totalServiceFees+=num(r.serviceFee);totalOtherCharges+=num(r.otherCharges);});
  const margin=gross>0?(profit/gross)*100:0;
  const netProfit=profit-totalServiceFees-totalOtherCharges;
  const netSales=gross;
  const netWithdrawal=wd-totalReturns;
  return{orders:filteredSales.length,qty,gross:+gross.toFixed(2),fees:+fees.toFixed(2),ref:+ref.toFixed(2),ship:+ship.toFixed(2),out:+out.toFixed(2),oth:+oth.toFixed(2),wd:+wd.toFixed(2),cost:+cost.toFixed(2),profit:+profit.toFixed(2),margin:+margin.toFixed(2),cancelled,returned,totalReturns:+totalReturns.toFixed(2),totalServiceFees:+totalServiceFees.toFixed(2),totalOtherCharges:+totalOtherCharges.toFixed(2),netSales:+netSales.toFixed(2),netProfit:+netProfit.toFixed(2),netWithdrawal:+netWithdrawal.toFixed(2),returnCount:filteredReturns.length};
}
function aggregate(rows){return aggregateWithReturns(rows,[]);}
function marketplaceFinancials(mktId){const sales=State.sales.filter(s=>String(s.mktId)===String(mktId));const settlements=State.sett.filter(s=>String(s.mktId)===String(mktId));const returns=State.returns.filter(r=>String(r.marketplaceId)===String(mktId));const agg=aggregateWithReturns(sales,returns);const totalWithdrawn=settlements.reduce((a,s)=>a+num(s.actual),0);const available=Math.max(0,agg.netWithdrawal-totalWithdrawn);return{sales:agg.gross,profit:agg.netProfit,withdrawalBalance:agg.netWithdrawal,totalWithdrawn:+totalWithdrawn.toFixed(2),available:+available.toFixed(2),orders:agg.orders,totalReturns:agg.totalReturns};}

/* ============================================================
   THEME SYSTEM
   ============================================================ */
const THEMES=[{id:'light',name:'Light',desc:'Soft, muted light interface.',bg:'#F0F2F5',card:'#F8F9FB',text:'#202733',primary:'#202733',btnText:'#ffffff'},{id:'dark',name:'Dark',desc:'Complete dark interface.',bg:'#0a0a0b',card:'#141416',text:'#f5f5f5',primary:'#f5f5f5',btnText:'#0a0a0b'},{id:'emerald',name:'Emerald Green',desc:'Professional emerald accents.',bg:'#f0f7f4',card:'#ffffff',text:'#1e293b',primary:'#047857',btnText:'#ffffff'},{id:'forest',name:'Forest & Mint',desc:'Forest Code #075E46 + Mint Fog #E8FFF2.',bg:'#E8FFF2',card:'#ffffff',text:'#0a2e1f',primary:'#075E46',btnText:'#ffffff'},{id:'original',name:'Original',desc:'Navy & gold classic.',bg:'#060913',card:'#0f1730',text:'#e5e7eb',primary:'#d4af37',btnText:'#0a1128'},{id:'glass',name:'Glass UI',desc:'Refined translucent glass effect.',bg:'#e8ecf1',card:'rgba(255,255,255,.55)',text:'#1e293b',primary:'#475569',btnText:'#ffffff'}];

function applyUserColors(){const colors=State.settings.themeColors||{};const root=document.documentElement;if(colors.accent)root.style.setProperty('--user-accent',colors.accent);else root.style.removeProperty('--user-accent');if(colors.bg)root.style.setProperty('--user-bg',colors.bg);else root.style.removeProperty('--user-bg');if(colors.card)root.style.setProperty('--user-card',colors.card);else root.style.removeProperty('--user-card');}
function applyTheme(id,persist=true){document.documentElement.setAttribute('data-theme',id);if(persist){try{localStorage.setItem('esmart_theme',id);}catch(e){}if(State.user)saveSetting('theme',id);}applyUserColors();const t=THEMES.find(x=>x.id===id);const btn=$('themeBtn');if(btn)btn.textContent='🎨 '+(t?t.name:'Theme');if(State.user&&State.page)setTimeout(()=>go(State.page),60);}
function currentTheme(){return State.settings.theme||localStorage.getItem('esmart_theme')||'light';}

function openThemeModal(){const cur=currentTheme();openModal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">Appearance & Theme</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="muted" style="margin-bottom:10px;font-size:12px">Select a theme. Changes apply to the entire application immediately.</div><div class="grid grid-3">${THEMES.map(t=>`<div class="theme-card ${cur===t.id?'current':''}"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:13px">${t.name}</div>${cur===t.id?'<span class="pill info">Active</span>':''}</div><div class="muted" style="font-size:11px;margin-top:2px">${t.desc}</div><div class="theme-preview" style="background:${t.bg};border-color:${t.primary};color:${t.text}"><div style="display:flex;gap:4px;margin-bottom:5px"><div style="flex:1;background:${t.card};border:1px solid ${t.primary}40;border-radius:4px;padding:4px"><div style="font-size:8px;opacity:.6">Sales</div><div style="font-size:10px;font-weight:800">AED 10,000</div></div><div style="flex:1;background:${t.card};border:1px solid ${t.primary}40;border-radius:4px;padding:4px"><div style="font-size:8px;opacity:.6">Profit</div><div style="font-size:10px;font-weight:800">AED 2,500</div></div></div><button style="background:${t.primary};color:${t.btnText};border:none;border-radius:4px;padding:3px 7px;font-size:9px;font-weight:700">Button</button><div style="margin-top:4px;background:${t.card};border:1px solid ${t.primary}40;border-radius:4px;padding:3px;font-size:9px">Table row</div></div><div style="display:flex;gap:4px;margin-top:6px"><button class="btn btn-sm" style="flex:1" onclick="applyTheme('${t.id}',false);closeModal();toast('Preview applied','success')">Preview</button><button class="btn btn-primary btn-sm" style="flex:1" onclick="applyTheme('${t.id}',true);closeModal();toast('Theme saved','success')">Apply</button></div></div>`).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="applyTheme('light',true);closeModal();toast('Light theme restored','success')">Restore Default (Light)</button></div>`);}

SER',{username,newId});await seedMarketplacesForUser(newId);await loadAll();btnLoading(btn,false);closeModal();toast('✓ Account created.','success');}catch(err){errEl.textContent='Failed: '+(err.message||err);btnLoading(btn,false);}};}

function go(p){State.page=p;renderNav();const titles={dashboard:'Dashboard',sales:'Sales Entry',all:'All Sales',returns:'Product Returns',mkt:'Marketplaces',products:'Products',sett:'Withdrawals & Settlements',ai:'AI Business Assistant',weekly:'Weekly Report',monthly:'Monthly Report',yearly:'Yearly Report',mktperf:'Marketplace Performance',imp:'Import / Export',settings:'Settings',backup:'Backup & Restore'};$('pageTitle').textContent=titles[p]||p;$('pageDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('view').innerHTML='';({dashboard:renderDash,sales:renderSalesEntry,all:renderAllSales,returns:renderReturns,mkt:renderMkt,products:renderProducts,sett:renderSett,ai:renderAI,weekly:renderWeekly,monthly:renderMonthly,yearly:renderYearly,mktperf:renderMktPerf,imp:renderImp,settings:renderSettings,backup:renderBackup})[p]();if(window.innerWidth<=1024)$('sidebar').classList.remove('open');window.scrollTo(0,0);}

function statusPill(s){const map={Delivered:'success',Shipped:'info',Confirmed:'info',Pending:'warn',Paid:'success',Settled:'success','Partially Paid':'warn',Cancelled:'danger',Returned:'danger',Refunded:'danger',Disputed:'danger','On Hold':''};return `<span class="pill ${map[s]||''}">${esc(s||'-')}</span>`;}
function mktLogo(m,size=26){if(!m)return '';if(m.logoDataUrl)return `<img src="${m.logoDataUrl}" class="mkt-logo" style="width:${size}px;height:${size}px" alt="${esc(m.name)}">`;const c=m.brandColor||'var(--user-accent, var(--primary))';return `<span style="display:inline-flex;width:${size}px;height:${size}px;border-radius:5px;border:1px solid ${c};background:var(--panel);color:${c};align-items:center;justify-content:center;font-weight:800;font-size:${Math.max(8,size/3)}px;margin-right:4px;vertical-align:middle">${(m.name||'?').slice(0,2).toUpperCase()}</span>`;}
function mktBadge(m){return m?`<span class="mkt-badge">${mktLogo(m,18)}${esc(m.name)}</span>`:'<span class="mkt-badge">Unknown</span>';}
function filteredSales(){let rows=State.sales.slice();const f=State.filters;if(f.from){const d=parseDate(f.from);rows=rows.filter(r=>parseDate(r.saleDate)>=d);}if(f.to){const d=parseDate(f.to);d.setHours(23,59,59);rows=rows.filter(r=>parseDate(r.saleDate)<=d);}if(f.mkt)rows=rows.filter(r=>String(r.mktId)===String(f.mkt));if(f.search){const q=f.search.toLowerCase();rows=rows.filter(r=>[r.orderNum,r.product,r.sku,r.txn].some(v=>(v||'').toLowerCase().includes(q)));}return rows;}

function renderDash(){$('view').innerHTML=`<div class="card"><div class="grid grid-4" style="align-items:end"><div><label>Date From</label><input type="date" class="input" id="f_from" value="${State.filters.from||''}"></div><div><label>Date To</label><input type="date" class="input" id="f_to" value="${State.filters.to||''}"></div><div><label>Marketplace</label><select class="input" id="f_mkt"><option value="">All</option>${State.mkt.map(m=>`<option value="${m.id}" ${State.filters.mkt==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div style="display:flex;gap:4px"><button class="btn btn-primary" onclick="State.filters.from=$('f_from').value;State.filters.to=$('f_to').value;State.filters.mkt=$('f_mkt').value;drawDash()">Apply</button><button class="btn" onclick="State.filters={};renderDash()">Reset</button></div></div></div><div id="kpiGrid" class="kpi-grid"></div><div id="mktDashSection"></div><div class="chart-grid-2"><div class="chart-box"><div class="chart-title">Monthly Sales</div><div class="chart-container"><canvas id="c_monthly"></canvas></div></div><div class="chart-box"><div class="chart-title">Monthly Profit</div><div class="chart-container"><canvas id="c_profit"></canvas></div></div><div class="chart-box"><div class="chart-title">Marketplace Sales</div><div class="chart-container"><canvas id="c_mktSales"></canvas></div></div><div class="chart-box"><div class="chart-title">Marketplace Profit</div><div class="chart-container"><canvas id="c_mktProfit"></canvas></div></div></div><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Recent Sales</h3><button class="btn btn-sm" onclick="go('all')">View all →</button></div><div class="table-wrap"><table class="data" id="recentTable"></table></div></div>`;drawDash();}

function drawDash(){const rows=filteredSales();const returns=State.returns;const t=today(),now=new Date(),cm=now.getMonth(),cy=now.getFullYear();const todayFilter=s=>s.saleDate===t;const monthFilter=s=>{const d=parseDate(s.saleDate);return d&&d.getMonth()===cm&&d.getFullYear()===cy;};const yearFilter=s=>{const d=parseDate(s.saleDate);return d&&d.getFullYear()===cy;};const todayAgg=aggregateWithReturns(rows.filter(todayFilter),returns.filter(r=>r.returnDate===t));const monthAgg=aggregateWithReturns(rows.filter(monthFilter),returns.filter(r=>{const d=parseDate(r.returnDate);return d&&d.getMonth()===cm&&d.getFullYear()===cy;}));const yearAgg=aggregateWithReturns(rows.filter(yearFilter),returns);const allAgg=aggregateWithReturns(rows,returns);const pending=State.sett.filter(s=>s.status!=='Settled').reduce((a,s)=>a+Math.max(0,num(s.expected)-num(s.actual)),0);const received=State.sett.reduce((a,s)=>a+num(s.actual),0);$('kpiGrid').innerHTML=`<div class="kpi"><div class="kpi-label">Sales Today</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(todayAgg.netSales)}</div></div><div class="kpi"><div class="kpi-label">Sales This Month</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(monthAgg.netSales)}</div></div><div class="kpi"><div class="kpi-label">Sales This Year</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(yearAgg.netSales)}</div></div><div class="kpi"><div class="kpi-label">Total Orders</div><div class="kpi-value">${allAgg.orders}</div></div><div class="kpi"><div class="kpi-label">Quantity Sold</div><div class="kpi-value">${allAgg.qty}</div></div><div class="kpi"><div class="kpi-label">Product Cost</div><div class="kpi-value danger">${fmt(allAgg.cost)}</div></div><div class="kpi"><div class="kpi-label">Marketplace Fees</div><div class="kpi-value warn">${fmt(allAgg.fees)}</div></div><div class="kpi"><div class="kpi-label">Withdrawal Balance</div><div class="kpi-value" style="color:var(--user-accent, var(--primary))">${fmt(allAgg.netWithdrawal)}</div></div><div class="kpi"><div class="kpi-label">Net Profit</div><div class="kpi-value ${allAgg.netProfit>=0?'success':'danger'}">${fmt(allAgg.netProfit)}</div></div><div class="kpi"><div class="kpi-label">Total Returns</div><div class="kpi-value danger">${fmt(allAgg.totalReturns)}</div></div><div class="kpi"><div class="kpi-label">Return Charges</div><div class="kpi-value warn">${fmt(allAgg.totalServiceFees+allAgg.totalOtherCharges)}</div></div><div class="kpi"><div class="kpi-label">Pending Settlement</div><div class="kpi-value warn">${fmt(pending)}</div></div><div class="kpi"><div class="kpi-label">Received</div><div class="kpi-value success">${fmt(received)}</div></div>`;const mktSection=$('mktDashSection');if(mktSection){mktSection.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">Marketplaces</h3><button class="btn btn-sm" onclick="go('mkt')">Manage →</button></div><div class="grid grid-5">${State.mkt.map(m=>{const f=marketplaceFinancials(m.id);return `<div class="mkt-card" style="border-left-color:${m.brandColor||'var(--user-accent, var(--primary))'}"><div class="mkt-card-name">${mktLogo(m,22)}${esc(m.name)}</div><div class="mkt-card-row"><span class="lbl">Sales</span><span class="val" style="color:var(--user-accent, var(--primary))">${fmt(f.sales)}</span></div><div class="mkt-card-row"><span class="lbl">Profit</span><span class="val ${f.profit>=0?'success':'danger'}">${fmt(f.profit)}</span></div><div class="mkt-card-row"><span class="lbl">W/D Balance</span><span class="val">${fmt(f.withdrawalBalance)}</span></div><div class="mkt-card-row"><span class="lbl">Withdrawn</span><span class="val success">${fmt(f.totalWithdrawn)}</span></div><div class="mkt-card-row"><span class="lbl">Available</span><span class="val warn">${fmt(f.available)}</span></div><div class="mkt-card-row"><span class="lbl">Returns</span><span class="val danger">${fmt(f.totalReturns)}</span></div></div>`;}).join('')}</div></div>`;}const recent=rows.slice().sort((a,b)=>(b.saleDate||'').localeCompare(a.saleDate||'')).slice(0,8);$('recentTable').innerHTML=`<thead><tr><th>Date</th><th>Marketplace</th><th>Order</th><th>Product</th><th>Qty</th><th>Sales</th><th>Withdrawal</th><th>Profit</th><th>Status</th></tr></thead><tbody>${recent.length?recent.map(r=>{const m=State.mkt.find(x=>x.id==r.mktId);return `<tr><td class="nowrap">${esc(fmtDate(r.saleDate))}</td><td>${mktBadge(m)}</td><td>${esc(r.orderNum||'')}</td><td>${esc((r.product||'').slice(0,28))}</td><td>${r.qty||0}</td><td>${fmt(r.gross)}</td><td>${fmt(r.wd)}</td><td class="${r.profit>=0?'success':'danger'}">${fmt(r.profit)}</td><td>${statusPill(r.orderStatus)}</td></tr>`;}).join(''):'<tr><td colspan="9" class="muted" style="text-align:center;padding:16px">No sales yet.</td></tr>'}</tbody>`;drawDashCharts(rows,returns);}

function destroyChart(k){if(charts[k]){charts[k].destroy();charts[k]=null;}}
function chartColors(){const t=currentTheme();const accent=State.settings.themeColors?.accent;const m={original:{p:accent||'#d4af37',s:'#22c55e',d:'#ef4444',t:'#9ca3af',g:'rgba(255,255,255,.06)',pal:[accent||'#d4af37','#60a5fa','#22c55e','#f59e0b','#a78bfa','#f472b6','#22d3ee']},light:{p:accent||'#202733',s:'#059669',d:'#dc2626',t:'#5F6875',g:'rgba(32,39,51,.06)',pal:[accent||'#202733','#2563eb','#059669','#d97706','#7c3aed','#db2777','#0891b2']},dark:{p:accent||'#f5f5f5',s:'#4ade80',d:'#f87171',t:'#a1a1aa',g:'rgba(255,255,255,.06)',pal:[accent||'#f5f5f5','#60a5fa','#4ade80','#fbbf24','#a78bfa','#f472b6','#22d3ee']},emerald:{p:accent||'#047857',s:'#059669',d:'#dc2626',t:'#475569',g:'rgba(4,120,87,.08)',pal:[accent||'#047857','#10b981','#34d399','#0d9488','#065f46','#6ee7b7','#064e3b']},forest:{p:accent||'#075E46',s:'#059669',d:'#b91c1c',t:'#3d7a5f',g:'rgba(7,94,70,.08)',pal:[accent||'#075E46','#059669','#10b981','#34d399','#6ee7b7','#a7f3d0','#064e3b']},glass:{p:accent||'#475569',s:'#059669',d:'#dc2626',t:'#475569',g:'rgba(30,41,59,.08)',pal:[accent||'#475569','#2563eb','#059669','#d97706','#7c3aed','#64748b','#0f172a']}};return m[t]||m.light;}

function drawDashCharts(rows,returns){const c=chartColors(),cur=State.settings.currency||'AED',now=new Date();const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}const sM={},pM={},rM={};rows.forEach(r=>{const k=monthKey(r.saleDate);if(!k)return;const t=revenueTreatment(r.orderStatus);sM[k]=(sM[k]||0)+num(r.gross)*t;pM[k]=(pM[k]||0)+num(r.profit)*t;});returns.forEach(r=>{const k=monthKey(r.returnDate);if(!k)return;rM[k]=(rM[k]||0)+num(r.totalReturnedAmount);});const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:c.t,font:{size:10}}}},scales:{x:{ticks:{color:c.t,font:{size:9}},grid:{color:c.g}},y:{ticks:{color:c.t,font:{size:9},callback:v=>cur+' '+v.toLocaleString()},grid:{color:c.g}}}};destroyChart('monthly');charts.monthly=new Chart($('c_monthly'),{type:'line',data:{labels:months.map(m=>m.slice(5)),datasets:[{label:'Sales',data:months.map(k=>sM[k]||0),borderColor:c.p,backgroundColor:c.p+'33',tension:.3,fill:true},{label:'Returns',data:months.map(k=>rM[k]||0),borderColor:c.d,backgroundColor:c.d+'33',tension:.3,fill:true}]},options:opts});destroyChart('profit');charts.profit=new Chart($('c_profit'),{type:'line',data:{labels:months.map(m=>m.slice(5)),datasets:[{label:'Profit',data:months.map(k=>pM[k]||0),borderColor:c.s,backgroundColor:c.s+'33',tension:.3,fill:true}]},options:opts});const mS={},mP={};rows.forEach(r=>{const m=State.mkt.find(x=>x.id==r.mktId);const n=m?m.name:'?';const t=revenueTreatment(r.orderStatus);mS[n]=(mS[n]||0)+num(r.gross)*t;mP[n]=(mP[n]||0)+num(r.profit)*t;});const names=Object.keys(mS);destroyChart('mktSales');charts.mktSales=new Chart($('c_mktSales'),{type:'doughnut',data:{labels:names,datasets:[{data:names.map(n=>mS[n]),backgroundColor:c.pal}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:c.t,font:{size:9}}}}}});destroyChart('mktProfit');charts.mktProfit=new Chart($('c_mktProfit'),{type:'bar',data:{labels:names,datasets:[{label:'Profit',data:names.map(n=>mP[n]),backgroundColor:names.map(n=>mP[n]>=0?c.s:c.d)}]},options:opts});}

function renderSalesEntry(){const mopts=State.mkt.filter(m=>m.active!==false).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');const defMkt=State.settings.defaultMktId||'';$('view').innerHTML=`<div class="grid grid-2"><div class="card"><h3>New Sale</h3><form id="sf"><div class="grid grid-3"><div><label>Sale Date *</label><input type="date" class="input" id="s_date" value="${today()}" required></div><div><label>Marketplace *</label><select class="input" id="s_mkt" required><option value="">Select...</option>${mopts}</select></div><div><label>Store Name</label><input class="input" id="s_storeName"></div><div><label>SKU / Store Code</label><input class="input" id="s_sku" placeholder="Used to identify product"></div><div><label>Transaction ID</label><input class="input" id="s_txn"></div><div><label>Order Number *</label><input class="input" id="s_order" required></div><div style="grid-column:span 2"><label>Product Name *</label><input class="input" id="s_prod" required></div><div><label>Quantity *</label><input type="number" class="input" id="s_qty" value="1" min="0" step="1" required></div><div><label>Order Status</label><select class="input" id="s_os">${(State.settings.orderStatuses||[]).map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Payment Status</label><select class="input" id="s_ps">${(State.settings.paymentStatuses||[]).map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Settlement Ref</label><input class="input" id="s_settRef"></div></div><div class="divider"></div><h3>Financial Information</h3><div class="grid grid-4"><div><label>Selling Price *</label><input type="number" step="0.01" class="input" id="s_price" value="0" required></div><div><label>Product Cost *</label><input type="number" step="0.01" class="input" id="s_pcost" value="0" required></div><div><label>Referral Fee</label><input type="number" step="0.01" class="input" id="s_ref" value="0"></div><div><label>Shipping Fee</label><input type="number" step="0.01" class="input" id="s_ship" value="0"></div><div><label>Outbound Fee</label><input type="number" step="0.01" class="input" id="s_out" value="0"></div><div><label>Other Fees</label><input type="number" step="0.01" class="input" id="s_oth" value="0"></div><div><label>Refund</label><input type="number" step="0.01" class="input" id="s_refund" value="0"></div><div><label>Notes</label><input class="input" id="s_notes"></div></div><div style="margin-top:10px;padding:8px;background:var(--panel2);border:1px dashed var(--border);border-radius:7px;font-family:monospace;font-size:11px" id="liveCalc"></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-primary" type="submit" id="saveBtn"> Save Sale</button><button class="btn btn-success" type="button" id="btnAnother">Save & Add Another</button><button class="btn" type="reset">Reset</button></div></form></div><div class="card"><h3>Live Calculation</h3><div id="calcBox" style="font-family:monospace;font-size:11px"></div><div class="divider"></div><div class="muted" style="font-size:10px"><b>Formula:</b> Withdrawal = Gross − Fees − Refund · Profit = Withdrawal − Cost · Margin = Profit ÷ Gross × 100</div><div class="divider"></div><div class="alert alert-info" style="font-size:11px"><b>Auto-save:</b> New products entered here are automatically saved to the Products section.</div></div></div>`;if(defMkt)$('s_mkt').value=defMkt;['s_qty','s_price','s_pcost','s_ref','s_ship','s_out','s_oth','s_refund'].forEach(i=>$(i).addEventListener('input',updCalc));updCalc();let saveAnother=false;$('btnAnother').onclick=()=>{saveAnother=true;$('sf').requestSubmit();};$('sf').onsubmit=async e=>{e.preventDefault();if(State.saving)return;State.saving=true;const btn=$('saveBtn');btnLoading(btn,true);const rec={saleDate:$('s_date').value,mktId:+$('s_mkt').value,storeName:$('s_storeName').value.trim(),sku:$('s_sku').value.trim(),txn:$('s_txn').value.trim(),orderNum:$('s_order').value.trim(),product:$('s_prod').value.trim(),qty:+$('s_qty').value||0,orderStatus:$('s_os').value,payStatus:$('s_ps').value,settRef:$('s_settRef').value.trim(),notes:$('s_notes').value.trim(),price:+$('s_price').value||0,pcost:+$('s_pcost').value||0,refFee:+$('s_ref').value||0,shipFee:+$('s_ship').value||0,outFee:+$('s_out').value||0,othFee:+$('s_oth').value||0,refund:+$('s_refund').value||0,ownerId:currentOwnerId(),createdAt:Date.now(),createdBy:State.user.username};if(!rec.saleDate||!rec.mktId||!rec.orderNum||!rec.product){toast('Fill required fields','error');btnLoading(btn,false);State.saving=false;return;}Object.assign(rec,calcSale(rec));try{await add('sales',rec);await audit('CREATE_SALE',{orderNum:rec.orderNum});try{const productIdentifier=(rec.sku||'').trim()||(rec.product||'').trim();if(productIdentifier){const existingProduct=State.products.find(p=>{const pSku=(p.sku||'').trim();const pName=(p.name||'').trim();if(rec.sku&&pSku)return pSku.toLowerCase()===rec.sku.toLowerCase();return pName.toLowerCase()===rec.product.toLowerCase();});if(!existingProduct){await add('products',{sku:rec.sku||'',name:rec.product||'',brand:'',category:'',defaultCost:rec.pcost||0,defaultPrice:rec.price||0,active:true,notes:'',ownerId:currentOwnerId(),createdAt:Date.now()});await audit('AUTO_CREATE_PRODUCT',{sku:rec.sku,name:rec.product,fromSale:rec.orderNum});}}}catch(prodErr){console.warn('Product auto-save warning:',prodErr);}await loadAll();toast('Sale saved ✓','success');scheduleBackup();if(saveAnother){saveAnother=false;$('sf').reset();$('s_date').value=today();updCalc();}else go('all');}catch(err){toast('Save failed: '+err.message,'error');}finally{btnLoading(btn,false);State.saving=false;}};};
function updCalc(){const r={qty:+$('s_qty')?.value||0,price:+$('s_price')?.value||0,pcost:+$('s_pcost')?.value||0,refFee:+$('s_ref')?.value||0,shipFee:+$('s_ship')?.value||0,outFee:+$('s_out')?.value||0,othFee:+$('s_oth')?.value||0,refund:+$('s_refund')?.value||0};const c=calcSale(r);const box=$('calcBox');if(!box)return;box.innerHTML=`<div>Gross: <b style="color:var(--user-accent, var(--primary))">${fmt(c.gross)}</b></div><div>Fees: −${fmt(c.fees)}</div><div>Withdrawal: <b style="color:var(--user-accent, var(--primary))">${fmt(c.wd)}</b></div><div>Cost: −${fmt(c.tc)}</div><div class="divider"></div><div>Profit: <b class="${c.profit>=0?'success':'danger'}">${fmt(c.profit)}</b></div><div>Margin: <b>${c.margin.toFixed(2)}%</b></div>`;const lc=$('liveCalc');if(lc)lc.innerHTML=`Gross: ${fmt(c.gross)} · Fees: ${fmt(c.fees)} · W/D: ${fmt(c.wd)} · Cost: ${fmt(c.tc)} · Profit: <span class="${c.profit>=0?'success':'danger'}">${fmt(c.profit)}</span> · Margin: ${c.margin.toFixed(1)}%`;}

let salesPage=1,salesSort={col:'saleDate',dir:'desc'};
function renderAllSales(){$('view').innerHTML=`<div class="card"><div class="grid grid-4" style="align-items:end"><div><label>Search</label><input class="input" id="as_search" placeholder="Order, SKU..." value="${State.filters.search||''}"></div><div><label>From</label><input type="date" class="input" id="as_from" value="${State.filters.from||''}"></div><div><label>To</label><input type="date" class="input" id="as_to" value="${State.filters.to||''}"></div><div><label>Marketplace</label><select class="input" id="as_mkt"><option value="">All</option>${State.mkt.map(m=>`<option value="${m.id}" ${State.filters.mkt==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div><div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-primary" onclick="State.filters.search=$('as_search').value;State.filters.from=$('as_from').value;State.filters.to=$('as_to').value;State.filters.mkt=$('as_mkt').value;salesPage=1;drawAllSales()">Apply</button><button class="btn" onclick="State.filters={};salesPage=1;renderAllSales()">Clear Filters</button><button class="btn" onclick="exportSales()">⬇ Export</button><button class="btn btn-primary" onclick="go('sales')">+ New Sale</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b id="as_count">0</b> records</div><div class="table-wrap"><table class="data" id="as_table"></table></div><div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><div class="muted" style="font-size:12px">Page <span id="as_page">1</span>/<span id="as_pages">1</span></div><div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="salesPage=Math.max(1,salesPage-1);drawAllSales()">← Prev</button><button class="btn btn-sm" onclick="salesPage++;drawAllSales()">Next →</button></div></div></div>`;drawAllSales();}
function drawAllSales(){const rows=filteredSales();$('as_count').textContent=rows.length;const pp=25,pages=Math.max(1,Math.ceil(rows.length/pp));if(salesPage>pages)salesPage=pages;$('as_page').textContent=salesPage;$('as_pages').textContent=pages;const sorted=rows.slice().sort((a,b)=>{const c=salesSort.col;let va=a[c],vb=b[c];if(c==='saleDate'){va=parseDate(va)||0;vb=parseDate(vb)||0;}if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();if(va<vb)return salesSort.dir==='asc'?-1:1;if(va>vb)return salesSort.dir==='asc'?1:-1;return 0;});const slice=sorted.slice((salesPage-1)*pp,salesPage*pp);const cols=[['saleDate','Date'],['mktId','Marketplace'],['orderNum','Order'],['sku','SKU'],['product','Product'],['qty','Qty'],['gross','Sales'],['fees','Fees'],['wd','W/D'],['tc','Cost'],['profit','Profit'],['orderStatus','Status']];$('as_table').innerHTML=`<thead><tr>${cols.map(([k,l])=>`<th style="cursor:pointer" data-col="${k}">${l} ${salesSort.col===k?(salesSort.dir==='asc'?'▲':'▼'):''}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${slice.length?slice.map(r=>{const m=State.mkt.find(x=>x.id==r.mktId);return `<tr><td class="nowrap">${esc(fmtDate(r.saleDate))}</td><td>${mktBadge(m)}</td><td>${esc(r.orderNum||'')}</td><td>${esc(r.sku||'')}</td><td>${esc((r.product||'').slice(0,26))}</td><td>${r.qty||0}</td><td>${fmt(r.gross)}</td><td>${fmt(r.fees)}</td><td>${fmt(r.wd)}</td><td>${fmt(r.tc)}</td><td class="${r.profit>=0?'success':'danger'}"><b>${fmt(r.profit)}</b></td><td>${statusPill(r.orderStatus)}</td><td><div class="row-actions"><button class="btn btn-sm" onclick="viewSale(${r.id})">View</button><button class="btn btn-sm" onclick="editSale(${r.id})">Edit</button><button class="btn btn-danger btn-sm" onclick="delSale(${r.id})">✕</button></div></td></tr>`;}).join(''):'<tr><td colspan="13" class="muted" style="text-align:center;padding:16px">No records.</td></tr>'}</tbody>`;$('as_table').querySelectorAll('th[data-col]').forEach(th=>th.onclick=()=>{const c=th.dataset.col;if(salesSort.col===c)salesSort.dir=salesSort.dir==='asc'?'desc':'asc';else{salesSort.col=c;salesSort.dir='asc';}drawAllSales();});}
function viewSale(id){const r=State.sales.find(x=>x.id===id);if(!r)return;const m=State.mkt.find(x=>x.id==r.mktId);openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">Sale #${r.id}</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="grid grid-2"><div><div class="muted" style="font-size:10px">Marketplace</div><div>${mktBadge(m)}</div><div class="muted" style="font-size:10px;margin-top:6px">Date</div><div>${esc(fmtDate(r.saleDate))}</div><div class="muted" style="font-size:10px;margin-top:6px">Order</div><div>${esc(r.orderNum||'')}</div><div class="muted" style="font-size:10px;margin-top:6px">Product</div><div>${esc(r.product||'')}</div><div class="muted" style="font-size:10px;margin-top:6px">Qty</div><div>${r.qty||0}</div><div class="muted" style="font-size:10px;margin-top:6px">Status</div><div>${statusPill(r.orderStatus)} ${statusPill(r.payStatus)}</div></div><div style="background:var(--panel2);border:1px dashed var(--border);border-radius:7px;padding:8px;font-family:monospace;font-size:11px"><div>Gross: ${fmt(r.gross)}</div><div>Fees: −${fmt(r.fees)}</div><div>W/D: <b style="color:var(--user-accent, var(--primary))">${fmt(r.wd)}</b></div><div>Cost: −${fmt(r.tc)}</div><div class="divider"></div><div>Profit: <b class="${r.profit>=0?'success':'danger'}">${fmt(r.profit)}</b></div><div>Margin: ${num(r.margin).toFixed(2)}%</div></div></div>`);}
async function delSale(id){if(!confirm('Delete this sale?'))return;await del('sales',id);await audit('DELETE_SALE',{id});await loadAll();drawAllSales();toast('Deleted','success');}
function editSale(id){const r=State.sales.find(x=>x.id===id);if(!r)return;const mopts=State.mkt.map(m=>`<option value="${m.id}" ${m.id==r.mktId?'selected':''}>${esc(m.name)}</option>`).join('');openModal(`<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0;color:var(--user-accent, var(--primary))">Edit #${r.id}</h3><button class="btn" onclick="closeModal()">Close</button></div><form id="ef"><div class="grid grid-3"><div><label>Date</label><input type="date" class="input" id="e_date" value="${esc(r.saleDate)}"></div><div><label>Marketplace</label><select class="input" id="e_mkt">${mopts}</select></div><div><label>Order</label><input class="input" id="e_order" value="${esc(r.orderNum)}"></div><div><label>Product</label><input class="input" id="e_prod" value="${esc(r.product)}"></div><div><label>Qty</label><input type="number" class="input" id="e_qty" value="${r.qty}"></div><div><label>Price</label><input type="number" step="0.01" class="input" id="e_price" value="${r.price}"></div><div><label>Cost</label><input type="number" step="0.01" class="input" id="e_pcost" value="${r.pcost}"></div><div><label>Ref Fee</label><input type="number" step="0.01" class="input" id="e_ref" value="${r.refFee||0}"></div><div><label>Ship Fee</label><input type="number" step="0.01" class="input" id="e_ship" value="${r.shipFee||0}"></div><div><label>Out Fee</label><input type="number" step="0.01" class="input" id="e_out" value="${r.outFee||0}"></div><div><label>Other</label><input type="number" step="0.01" class="input" id="e_oth" value="${r.othFee||0}"></div><div><label>Refund</label><input type="number" step="0.01" class="input" id="e_refund" value="${r.refund||0}"></div></div><div style="margin-top:10px;display:flex;gap:4px;justify-content:flex-end"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`);$('ef').onsubmit=async e=>{e.preventDefault();const upd={...r,saleDate:$('e_date').value,mktId:+$('e_mkt').value,orderNum:$('e_order').value,product:$('e_prod').value,qty:+$('e_qty').value,price:+$('e_price').value,pcost:+$('e_pcost').value,refFee:+$('e_ref').value,shipFee:+$('e_ship').value,outFee:+$('e_out').value,othFee:+$('e_oth').value,refund:+$('e_refund').value,updatedAt:Date.now()};Object.assign(upd,calcSale(upd));await put('sales',upd);await audit('UPDATE_SALE',{id});await loadAll();closeModal();drawAllSales();toast('Updated','success');};}
function exportSales(){const rows=State.sales.map(s=>{const m=State.mkt.find(x=>x.id==s.mktId);return{Date:fmtDate(s.saleDate),Marketplace:m?.name||'',SKU:s.sku||'',Order:s.orderNum||'',Product:s.product||'',Qty:s.qty,Price:s.price,Cost:s.pcost,Fees:s.fees,Withdrawal:s.wd,Profit:s.profit,Status:s.orderStatus};});const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sales');XLSX.writeFile(wb,`sales-${Date.now()}.xlsx`);toast('Exported','success');}
