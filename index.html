function renderAIMessage(msg) {
  if (msg.role === 'user') {
    return `<div class="ai-message user"><div class="ai-bubble">${esc(msg.text)}</div></div>`;
  }
  
  const r = msg.response;
  if (!r) return '';
  
  if (r.type === 'error') {
    return `<div class="ai-message assistant"><div class="ai-bubble"><div class="ai-error">${esc(r.text)}</div></div></div>`;
  }
  
  if (r.type === 'help' || r.type === 'unknown' || r.type === 'clarification') {
    return `<div class="ai-message assistant"><div class="ai-bubble">
      ${r.title ? `<p><b>${esc(r.title)}</b></p>` : ''}
      ${r.text ? `<p>${esc(r.text)}</p>` : ''}
      ${r.note ? `<p class="muted" style="font-size:11px">${esc(r.note)}</p>` : ''}
      ${r.suggestions ? `<div class="ai-suggestions" style="margin-top:8px">${r.suggestions.map(s => `<span class="ai-suggestion" onclick="askAI('${esc(s).replace(/'/g, "\\'")}')">${esc(s)}</span>`).join('')}</div>` : ''}
    </div></div>`;
  }
  
  // Data response
  let html = `<div class="ai-message assistant"><div class="ai-bubble">`;
  if (r.title) html += `<p><b>${esc(r.title)}</b></p>`;
  if (r.dateRange) html += `<p class="muted" style="font-size:11px">📅 ${esc(r.dateRange)}</p>`;
  if (r.warning) html += `<div class="ai-warning">${esc(r.warning)}</div>`;
  
  if (r.metrics) {
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:8px 0">`;
    r.metrics.forEach(m => {
      const changeHtml = m.change !== undefined ? `<div class="sub">${m.change >= 0 ? '↑' : '↓'} ${Math.abs(m.change).toFixed(1)}%</div>` : '';
      html += `<div class="ai-metric-card"><div class="label">${esc(m.label)}</div><div class="value">${esc(m.value)}</div>${changeHtml}</div>`;
    });
    html += `</div>`;
  }
  
  if (r.statusBreakdown) {
    html += `<div style="margin:8px 0"><b>By Status:</b> `;
    html += Object.entries(r.statusBreakdown).map(([k, v]) => `<span class="pill" style="margin:2px">${esc(k)}: ${v}</span>`).join(' ');
    html += `</div>`;
  }
  
  if (r.table) {
    html += `<div class="table-wrap" style="margin:8px 0"><table><thead><tr>${Object.keys(r.table[0]).map(k => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>`;
    r.table.forEach(row => {
      html += `<tr>${Object.values(row).map(v => `<td>${esc(v)}</td>`).join('')}</tr>`;
    });
    html += `</tbody></table></div>`;
  }
  
  if (r.chart) {
    html += `<div class="ai-chart-container"><canvas id="aiChart_${Date.now()}"></canvas></div>`;
  }
  
  if (r.interpretation) {
    const isVerified = r.interpretation.includes('verified') || !r.interpretation.includes('forecast');
    html += `<p class="${isVerified ? 'verified' : 'interpretation'}" style="margin-top:8px;font-size:12px">💡 ${esc(r.interpretation)}</p>`;
  }
  
  if (r.sourceAction) {
    html += `<button class="ai-source-btn" onclick="viewAISource('${r.sourceAction.view}', ${JSON.stringify(r.sourceAction.filters).replace(/"/g, '&quot;')})">📋 View Source Records →</button>`;
  }
  
  html += `</div></div>`;
  return html;
}

function viewAISource(view, filters) {
  if (filters.from) State.filters.from = filters.from;
  if (filters.to) State.filters.to = filters.to;
  if (filters.mkt) State.filters.mkt = filters.mkt;
  if (filters.focus) State.filters.mkt = filters.focus;
  go(view);
}

async function sendAIQuestion() {
  const input = $('aiInput');
  const question = input.value.trim();
  if (!question) return;
  
  input.value = '';
  aiConversation.push({ role: 'user', text: question });
  renderAI();
  
  // Show loading
  const msgs = $('aiMessages');
  msgs.innerHTML += `<div class="ai-message assistant" id="aiLoading"><div class="ai-bubble"><div class="ai-loading"><span></span><span></span><span></span></div></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  
  // Process with small delay for UX
  setTimeout(async () => {
    const response = await AIAssistant.answer(question);
    aiConversation[aiConversation.length - 1] = { role: 'assistant', response };
    renderAI();
  }, 400);
}

function askAI(question) {
  $('aiInput').value = question;
  sendAIQuestion();
}

function clearAIConversation() {
  aiConversation = [];
  AIAssistant.conversation = [];
  renderAI();
}

function renderAIQuickInsights() {
  const el = $('aiQuickInsights');
  if (!el) return;
  
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const monthSales = State.sales.filter(s => monthKey(s.saleDate) === thisMonth);
  const monthReturns = State.returns.filter(r => monthKey(r.returnDate) === thisMonth);
  const monthAgg = aggregateWithReturns(monthSales, monthReturns);
  
  const pendingSett = State.sett.filter(s => s.status !== 'Settled');
  const pendingAmount = pendingSett.reduce((a, s) => a + Math.max(0, num(s.expected) - num(s.actual)), 0);
  
  const negativeProducts = State.products.filter(p => {
    const sales = State.sales.filter(s => s.sku && s.sku.toLowerCase() === (p.sku || '').toLowerCase());
    const totalProfit = sales.reduce((a, s) => a + num(s.profit), 0);
    return totalProfit < 0;
  });
  
  el.innerHTML = `
    <div class="ai-metric-card">
      <div class="label">Month Sales</div>
      <div class="value">${fmt(monthAgg.netSales)}</div>
    </div>
    <div class="ai-metric-card">
      <div class="label">Pending Payouts</div>
      <div class="value warn">${fmt(pendingAmount)}</div>
    </div>
    <div class="ai-metric-card">
      <div class="label">Loss Products</div>
      <div class="value ${negativeProducts.length > 0 ? 'danger' : 'success'}">${negativeProducts.length}</div>
    </div>
  `;
}

function renderAIAlerts() {
  const el = $('aiAlerts');
  if (!el) return;
  
  const alerts = [];
  
  // Backup alert
  if (State.settings.autoBackup && BackupManager.lastError) {
    alerts.push({ level: 'critical', title: 'Backup Failed', desc: BackupManager.lastError });
  } else if (!State.settings.autoBackup) {
    alerts.push({ level: 'warning', title: 'Auto-Backup Disabled', desc: 'Enable automatic backups to protect your data.' });
  }
  
  // Pending settlements
  const pendingSett = State.sett.filter(s => s.status !== 'Settled');
  if (pendingSett.length > 0) {
    const amount = pendingSett.reduce((a, s) => a + Math.max(0, num(s.expected) - num(s.actual)), 0);
    alerts.push({ level: 'warning', title: `${pendingSett.length} Pending Settlements`, desc: `${fmt(amount)} awaiting reconciliation.` });
  }
  
  // Negative profit products
  const negativeProducts = State.products.filter(p => {
    const sales = State.sales.filter(s => s.sku && s.sku.toLowerCase() === (p.sku || '').toLowerCase());
    return sales.length > 0 && sales.reduce((a, s) => a + num(s.profit), 0) < 0;
  });
  if (negativeProducts.length > 0) {
    alerts.push({ level: 'critical', title: `${negativeProducts.length} Loss-Making Products`, desc: 'Review pricing and costs.' });
  }
  
  // High return rate
  const totalSales = State.sales.reduce((a, s) => a + num(s.qty), 0);
  const totalReturns = State.returns.reduce((a, r) => a + num(r.qtyReturned), 0);
  const returnRate = totalSales > 0 ? (totalReturns / totalSales) * 100 : 0;
  if (returnRate > 10) {
    alerts.push({ level: 'warning', title: 'High Return Rate', desc: `${returnRate.toFixed(1)}% of units returned.` });
  }
  
  if (alerts.length === 0) {
    el.innerHTML = '<div class="muted" style="font-size:12px">✅ No alerts. Business looks healthy.</div>';
  } else {
    el.innerHTML = alerts.map(a => `<div class="alert-item ${a.level}"><div class="alert-title">${esc(a.title)}</div><div class="alert-desc">${esc(a.desc)}</div></div>`).join('');
  }
}

function updateAISettings() {
  const provider = $('ai_provider').value;
  const enabled = $('ai_enabled').value === 'true';
  saveSetting('aiProvider', provider);
  saveSetting('aiEnabled', enabled);
  toast('AI settings updated', 'success');
}

   BOOT
   ============================================================ */
async function boot(){
  try{
    await openDB();
    await seed();
    await loadAll();
    const theme=State.settings.theme||localStorage.getItem('esmart_theme')||'light';
    applyTheme(theme,false);
    $('currencyPill').textContent=State.settings.currency||'AED';
    if(State.settings.autoBackup) BackupManager.start();
    $('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').textContent='';const btn=$('loginBtn');btnLoading(btn,true);const u=$('lu').value.trim(),p=$('lp').value;try{await loadAll();const user=State.users.find(x=>x.username===u&&x.password===p&&x.active!==false);if(!user){$('loginErr').innerHTML='<div class="alert alert-error">Invalid username or password.</div>';btnLoading(btn,false);return;}State.user=user;await audit('LOGIN',{username:u});await loadAll();$('loginScreen').classList.add('hide');$('appShell').classList.remove('hide');$('sideUser').textContent=user.fullName||user.username;$('userPill').textContent=`${user.fullName||user.username} · ${user.role}`;renderNav();go('dashboard');toast(`Welcome, ${user.fullName||user.username}`,'success');if(State.settings.autoBackup)BackupManager.start();}catch(err){$('loginErr').innerHTML='<div class="alert alert-error">Login error: '+(err.message||err)+'</div>';}finally{btnLoading(btn,false);}};}catch(err){console.error('Boot error:',err);$('loginScreen').innerHTML=`<div class="card login-card"><h3 style="color:var(--danger)">Application Error</h3><p class="muted" style="font-size:12px">${esc(err.message||String(err))}</p><button class="btn btn-danger" onclick="indexedDB.deleteDatabase('esmart_db').onsuccess=()=>location.reload()">Reset Database & Reload</button><button class="btn" onclick="location.reload()" style="margin-left:6px">Reload</button></div>`;}}
boot();
</script>
